[package]
name = "pms-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = "1.47.1"
pms-network = { path = "../pms-network" }
pms-interface = { path = "../pms-interface" }
pms-wire = { path = "../pms-wire" }
pms-storage = { path = "../pms-storage" }
pms-config = { path = "../pms-config" }
pms-wallet = { path = "../pms-wallet" }
pms-types-payload = { path = "../pms-types-payload" }
pms-utils = { path = "../pms-utils" }
pms-core = { path = "../pms-core" }
pms-ledger = { path = "../pms-ledger" }
pms-types-block = { path = "../pms-types-block" }
dashmap = "7.0.0-rc2"
anyhow = "1.0.99"
serde_json = "1.0.143"
lru = "0.16.3"  # Fixed RUSTSEC-2026-0002 (IterMut unsoundness)
rand = "0.9.2"
prometheus = "0.14.0"
# Note: rustls-pemfile removed - using rustls native PEM support (pki_types::pem::PemObject)
once_cell = "1.21.3"
axum = { version = "0.8.4", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
config = "0.15"
rustls = { workspace = true }
tokio-util = "0.7.17"
tokio-rustls = { workspace = true }
rust_decimal = "1.38.0"
tower-http = { version = "0.6.6", features = [
    "limit",
    "timeout",
    "trace",
    "cors",
    "fs",
    "catch-panic",
] }
tower_governor = "0.8.0"
base64 = "0.22.1"
hex = "0.4.3"
k256 = "0.13.4"
tower = { version = "0.5.2", features = ["limit"] }
pms-types = { path = "../pms-types" }
pms-token = { path = "../pms-token" }
sha2 = "0.10.8"
subtle = "2.5"  # Constant-time comparison for security-sensitive operations
http = "1.3.1"
ipnetwork = "0.20" # For CIDR parsing in IP allowlist
axum-macros = "0.5.0"
pms-types-nft = { path = "../pms-types-nft" }
pms-bridge = { path = "../pms-bridge" }
pms-event = { path = "../pms-event" }
pms-types-contract = { path = "../pms-types-contract" }
chrono = "0.4.42"
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"


[dev-dependencies]
tempfile = "3.23.0"
pms-utils = { path = "../pms-utils" }
pms-testkit = { path = "../pms-testkit" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
dotenvy = "0.15.7"
async-trait = "0.1.86"
futures = "0.3" # Pour join_all - exécution parallèle des workers
chrono = "0.4.42"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
pms-types-nft = { path = "../pms-types-nft" }
x25519-dalek = "2.0.1" # For coordinator wallet X25519 key derivation
regex = "1.10"
