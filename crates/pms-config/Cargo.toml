[package]
name = "pms-config"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.100"
config = "0.15.16"
thiserror = "2.0.16"
rust_decimal = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rand = "0.9.2"
# Pinned to 0.6 to match the `CryptoRngCore` trait required by
# `k256`/`ecdsa` 0.13. Upgrading these would let us drop this line.
rand_core = "0.6"
tempfile = "3"
