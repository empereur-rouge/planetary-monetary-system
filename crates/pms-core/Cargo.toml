[package]
name = "pms-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pms-types = { path = "../pms-types" }
pms-storage = { path = "../pms-storage" }
pms-utils = { path = "../pms-utils" }
pms-network = { path = "../pms-network" }
pms-interface = { path = "../pms-interface" }
pms-wire = { path = "../pms-wire" }
pms-config = { path = "../pms-config" }
pms-wallet = { path = "../pms-wallet" }
pms-errors = { path = "../pms-errors" }
rand = "0.9.2"
serde_json = "1.0.142"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1.89"
anyhow = "1.0.99"
tokio = "1.47.1"
thiserror = "2.0.16"
hex = "0.4.3"
sha2 = "0.10.9"
rust_decimal = "1.39.0"
num-traits = "0.2"
tracing = "0.1"
tempfile = "3.23.0"
base64 = "0.21.7"
signature = "2.2.0"
k256 = "0.13.4"
dashmap = "6.1"
lru = "0.16.3"
rayon = "1.11.0"
pms-consensus = { version = "0.1.0", path = "../pms-consensus" }
pms-types-nft = { path = "../pms-types-nft" }
pms-event = { path = "../pms-event" }

[dev-dependencies]
hex = "0.4.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
pms-testkit = { path = "../pms-testkit" }
rand_core = "0.6"                                                   # Pour les tests crypto
serde_json = "1.0"
