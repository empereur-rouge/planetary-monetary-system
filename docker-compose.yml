# =============================================================================
# Production Docker Compose - Single Node
# =============================================================================
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pms-node:latest
    container_name: pms-node
    user: "pms"
    environment:
      RUST_LOG: info,pms_server=info
      PMS_CONFIG: /home/pms/config/config.prod.toml
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN:-changeme}"
      PMS__LIMITS__RATE_LIMIT_RPS: 1000
      PMS__LIMITS__BURST: 2000
    volumes:
      # Configuration
      - ./etc/config/config.prod.toml:/home/pms/config/config.prod.toml:ro
      - ./etc/pms/node.key:/home/pms/config/node-identity.key:ro
      - ./etc/pms/admin-wallet.json:/home/pms/config/admin-wallet.json:ro
      - ./secrets/tls:/home/pms/tls:ro
      # Persistent storage
      - pms_data:/home/pms/data
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080" # API
      - "8443:8443" # P2P
    restart: unless-stopped

volumes:
  pms_data:
