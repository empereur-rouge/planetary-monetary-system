# =============================================================================
# Production Docker Compose - Engine + Gateway + Caddy + Prometheus
# =============================================================================
#
# Architecture:
#   Internet → Caddy (80/443, Let's Encrypt)
#                → Gateway (8443, self-signed TLS interne)
#                    → Engine (8080, self-signed TLS interne)
#              Prometheus (9091, localhost only)
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PMS Engine (Coordinator) - INTERNAL ONLY
  # ---------------------------------------------------------------------------
  pms-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pms-node:latest
    container_name: pms-engine
    hostname: pms-engine
    user: "pms"
    environment:
      RUST_LOG: info,pms_server=info,pms_core=info
      PMS_CONFIG: /home/pms/config/config.prod.toml
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN:-changeme}"
      PMS__LIMITS__RATE_LIMIT_RPS: 5000
      PMS__LIMITS__BURST: 10000
    volumes:
      - ./etc/config:/home/pms/config:rw
      - ./etc/pms:/home/pms/config/pms:rw
      - ./secrets/tls:/home/pms/tls:ro
      - rocksdb_data:/home/pms/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - pms-internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PMS Gateway - Proxies to Engine (accessed by Caddy only)
  # ---------------------------------------------------------------------------
  pms-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: pms-gateway:latest
    container_name: pms-gateway
    hostname: pms-gateway
    depends_on:
      pms-engine:
        condition: service_healthy
    environment:
      RUST_LOG: info,pms_gateway=info
      UPSTREAM_URL: https://pms-engine:8080
      LISTEN_ADDR: 0.0.0.0:8443
      TLS_CERT: /app/tls/cert.pem
      TLS_KEY: /app/tls/key.pem
      ADMIN_TOKEN: "${PMS_ADMIN_TOKEN:-changeme}"
      DASHBOARD_PATH: /app/dashboard
      RATE_LIMIT_RPS: 1000
      BURST_SIZE: 2000
    volumes:
      - ./secrets/tls:/app/tls:ro
    expose:
      - "8443"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8443' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - pms-internal
      - pms-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Caddy - TLS termination + Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pms-gateway:
        condition: service_healthy
    networks:
      - pms-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics (localhost only)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pms-prometheus
    volumes:
      - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - pms-internal
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  pms-internal:
    driver: bridge
    internal: true
  pms-public:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  rocksdb_data:
  caddy_data:
  caddy_config:
  prometheus_data:
