# =============================================================================
# Production Docker Compose - Single Node + Caddy (Let's Encrypt)
# =============================================================================
services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pms-node:latest
    container_name: pms-node
    user: "pms"
    environment:
      RUST_LOG: info,pms_server=info
      PMS_CONFIG: /home/pms/config/config.prod.toml
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN:-changeme}"
      PMS__LIMITS__RATE_LIMIT_RPS: 1000
      PMS__LIMITS__BURST: 2000
    volumes:
      # Configuration
      - ./etc/config/config.prod.toml:/home/pms/config/config.prod.toml:rw
      - ./etc/pms:/home/pms/config/pms:rw
      - ./secrets/tls:/home/pms/tls:ro
      # Persistent storage
      - pms_data:/home/pms/data
    # Validated Production Healthcheck (Using curl with HTTPS -k for self-signed)
    healthcheck:
      test: [ "CMD-SHELL", "curl -k -f https://127.0.0.1:8080/livez || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Internal port only - Caddy handles external traffic
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy
    restart: unless-stopped
    ports:
      - "80:80" # HTTP (Let's Encrypt challenge)
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      node1:
        condition: service_healthy

volumes:
  pms_data:
  caddy_data:
  caddy_config:
