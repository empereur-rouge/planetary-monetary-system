# =============================================================================
# Production Docker Compose - Single Node + Caddy (Let's Encrypt)
# =============================================================================
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pms-node:latest
    container_name: pms-node
    user: "pms"
    environment:
      RUST_LOG: info,pms_server=info
      PMS_CONFIG: /home/pms/config/config.prod.toml
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN:-changeme}"
      PMS__LIMITS__RATE_LIMIT_RPS: 1000
      PMS__LIMITS__BURST: 2000
    volumes:
      # Configuration
      - ./etc/config/config.prod.toml:/home/pms/config/config.prod.toml:ro
      - ./etc/pms:/home/pms/config/pms:rw
      - ./secrets/tls:/home/pms/tls:ro
      # Persistent storage
      - pms_data:/home/pms/data
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Pas de ports exposés directement - Caddy fait le proxy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy
    restart: unless-stopped
    ports:
      - "80:80" # HTTP (Let's Encrypt challenge)
      - "443:443" # HTTPS
    volumes:
      - ./caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      node:
        condition: service_healthy

volumes:
  pms_data:
  caddy_data:
  caddy_config:
