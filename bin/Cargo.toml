[package]
name = "bin"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
pms-server = { path = "../crates/pms-server" }
pms-core = { path = "../crates/pms-core" }
pms-storage = { path = "../crates/pms-storage" }
pms-interface = { path = "../crates/pms-interface" }
pms-types-block = { path = "../crates/pms-types-block" }
pms-utils = { path = "../crates/pms-utils" }
pms-config = { path = "../crates/pms-config" }
pms-wire = { path = "../crates/pms-wire" }
pms-wallet = { path = "../crates/pms-wallet" }
pms-ledger = { path = "../crates/pms-ledger" }
tokio = "1.47.1"
owo-colors = "4"
tracing-log = "0.2.0"
dotenvy = "0.15"
# rustls-pemfile removed - using rustls native PEM support (pki_types::pem::PemObject)
rustls = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
webbrowser = "1.0"
dashmap = "6.1.0"
