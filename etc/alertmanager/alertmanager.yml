# =============================================================================
# Alertmanager — PMS Testnet routing (Telegram-first)
# =============================================================================
#
# Default setup uses Alertmanager's built-in `telegram_configs` receiver
# (added in v0.24, we're on v0.27.0). Two secrets you need to provide:
#
#   1. `secrets/telegram_bot_token` — one-line file with your bot token
#      from @BotFather (looks like `123456789:ABC-DEF...`). Mounted
#      read-only into the container at `/etc/alertmanager/telegram_bot_token`.
#      This file is .gitignored.
#
#   2. `chat_id:` below — set to your private channel ID. For channels
#      it's a negative integer like `-1001234567890`. To get it: send
#      any message in the channel, then
#         curl https://api.telegram.org/bot<TOKEN>/getUpdates
#      and look for `chat.id` in the JSON.
#
# Until those two are filled in, alerts go to the `null` receiver
# (silently dropped) so a fresh deploy doesn't crash. Health-check the
# alertmanager UI at http://127.0.0.1:9093 (loopback-bound).
#
# Want to use Better Uptime / PagerDuty / Slack / Discord instead?
# See `documentation/runbooks/alerting.md` — the alternative receiver
# blocks are commented at the bottom of this file.
# =============================================================================

global:
  resolve_timeout: 5m

# ---------------------------------------------------------------------------
# Routing tree
# ---------------------------------------------------------------------------
route:
  # Default receiver — used by anything that doesn't match a child.
  # Switch this to `pager` once you've filled in your bot_token + chat_id.
  receiver: 'pager'

  group_by: ['alertname', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical → Telegram with sound (re-page hourly while firing)
    - matchers:
        - severity = critical
      receiver: 'pager'
      repeat_interval: 1h
      group_wait: 10s

    # Warning → Telegram silent (no re-page, just acknowledge)
    - matchers:
        - severity = warning
      receiver: 'notify'

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:

  - name: 'null'

  # ─── Pager (critical alerts) → Telegram with notification ────────────────
  - name: 'pager'
    telegram_configs:
      - bot_token_file: '/etc/alertmanager/telegram_bot_token'
        # Replace with your channel/chat ID. Negative for channels (e.g.
        # -1001234567890), positive for direct messages to your user.
        chat_id: 1800635048
        # Plays the channel's notification sound. Set to true to send a
        # silent message (no sound, useful if you have multiple channels
        # routed to the same chat).
        disable_notifications: false
        parse_mode: 'HTML'
        message: |-
          {{ if eq .Status "firing" }}🚨 <b>{{ .GroupLabels.alertname }}</b> [<i>FIRING</i>]{{ else }}✅ <b>{{ .GroupLabels.alertname }}</b> [<i>RESOLVED</i>]{{ end }}

          {{ range .Alerts -}}
          <b>{{ .Annotations.summary }}</b>

          {{ .Annotations.description }}

          {{ if .Annotations.runbook }}<i>Runbook:</i> <code>{{ .Annotations.runbook }}</code>
          {{ end }}
          {{ end -}}

          <i>Component:</i> <code>{{ .CommonLabels.component }}</code>
          <i>Severity:</i> <code>{{ .CommonLabels.severity }}</code>

  # ─── Low-noise notify (warning alerts) → Telegram silent ────────────────
  - name: 'notify'
    telegram_configs:
      - bot_token_file: '/etc/alertmanager/telegram_bot_token'
        # Can be the same chat_id as `pager` above, or a separate
        # "warnings-only" channel if you want to keep noise out of the
        # paging channel.
        chat_id: 1800635048
        # Silent: just lands in chat, no notification sound.
        disable_notifications: true
        parse_mode: 'HTML'
        message: |-
          {{ if eq .Status "firing" }}⚠️ <b>{{ .GroupLabels.alertname }}</b> [<i>FIRING</i>]{{ else }}✅ <b>{{ .GroupLabels.alertname }}</b> [<i>RESOLVED</i>]{{ end }}

          {{ range .Alerts -}}
          <b>{{ .Annotations.summary }}</b>

          {{ .Annotations.description }}
          {{ end -}}

          <i>Component:</i> <code>{{ .CommonLabels.component }}</code>

# ---------------------------------------------------------------------------
# Inhibition rules — silence redundant alerts
# ---------------------------------------------------------------------------
inhibit_rules:
  # If the engine is fully down, don't also fire the secondary alerts
  # (queue/persist/bloom) — they're symptoms, not new info.
  - source_matchers:
      - alertname = "EngineDown"
    target_matchers:
      - component =~ "persist-pipeline|storage"
    equal: ['component']

# ---------------------------------------------------------------------------
# Alternative receivers (commented) — Better Uptime / PagerDuty / Slack / Discord
# ---------------------------------------------------------------------------
#
# Want a different paging path? Replace the `telegram_configs` block(s)
# above with one of these. Full setup walkthrough in
# `documentation/runbooks/alerting.md`.
#
# === Better Uptime (incoming webhook) ===
#   webhook_configs:
#     - url: 'https://uptime.betterstack.com/api/v1/incoming-webhooks/<TOKEN>'
#       send_resolved: true
#
# === PagerDuty (Events API v2) ===
#   pagerduty_configs:
#     - service_key: '<INTEGRATION_KEY>'
#       send_resolved: true
#       description: '{{ .CommonAnnotations.summary }}'
#
# === Discord (incoming webhook) ===
#   webhook_configs:
#     - url: 'https://discord.com/api/webhooks/<ID>/<TOKEN>'
#       send_resolved: true
#
# === Slack (incoming webhook) ===
#   slack_configs:
#     - api_url: 'https://hooks.slack.com/services/<...>'
#       channel: '#pms-alerts'
#       send_resolved: true
#       title: '{{ .CommonAnnotations.summary }}'
