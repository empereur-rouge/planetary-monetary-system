server {
    listen 80;
    server_name node1.pms.yourdomain.com;

    # Redirige tout vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name node1.pms.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/node1.pms.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node1.pms.yourdomain.com/privkey.pem;

    # HSTS : force HTTPS côté client
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Taille max du body (anti payload trop gros)
    client_max_body_size 512k;

    # Timeouts raisonnables
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;

    # Proxy vers ton node Rust
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Tu pourras plus tard mettre une section /admin avec IP allowlist
    location /admin/ {
        proxy_pass http://127.0.0.1:8080/admin/;
        allow 1.2.3.4;      # IP ops
        deny  all;
    }
}