# Configuration E2E Local Test (Dry-Run)
# =============================================================================
# Configuration for local E2E testing without Docker.
# - No TLS (HTTP only)
# - Single Writer Mode enabled
# - High rate limits for testing
# - Local file paths

[rocks]
path = "./data/pms-rocks/local-test"
prefix = "pms:test"
tip_limit = 256
checkpoint_interval_secs = 3600

[network]
mode = "testnet"
network_id = "pms-e2e-test"
protocol_version = 1

[address]
hrp = "8e"

[admin]
# Treasury wallets loaded from signed JSON file
treasury_wallets_file = "./etc/pms/treasury-wallets.json"

[client]
bind_addr = "127.0.0.1:8080"  # HTTP only, no TLS
api_addr = "127.0.0.1:8080"
internal_api_addr = "127.0.0.1:3000"
allow_insecure_tls = false

[p2p]
known_peers = ""
allowed_peer_ips = []
strict_whitelist = false

# No [tls] section - HTTP only for local testing

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 100000  # High rate limit for E2E testing
burst = 200000

[fees]
epsilon = "0.001"
mode = "uniform"
# Fee Distribution (Coordinator + Treasury)
coordinator_fee_percent = 65 # 65% to coordinator
treasury_fee_percent = 35    # 35% to treasury wallets
# Scheduled Inflation Mint
daily_inflation_enabled = false  # Enable for production
daily_inflation_interval_sec = 86400  # 24h
annual_inflation_percent = 3.0
treasury_reward_percent = 20
creator_reward_percent = 70
burn_percent = 10
treasury_addresses = ["pms1z053s5nyhpsewdn5cv9wl3kse3h8wt0zv2vpkv7kt798jdy3vctvj7fqns5huaupn03ejw4tffgg26m9yq4s6f8wtr"]

# AUTHORITY PUBLIC KEYS - For local testing
# Note: The e2e_local test generates its own Authority keypair
# This is just a placeholder that should match the format
authority_public_keys = [
    "02b73a3c1192d15d906f675c5a9653886d1de6a1ded2cf8c0fc7b8aba1e31bb54a"
]
authority_keys_last_rotation = "2026-02-03"

[auth]
require_signed_submit = true
admin_api_token = "env:PMS_ADMIN_TOKEN"
allowed_ips = []

[secrets]
node_identity_key_path = "./etc/pms/node.key"
admin_wallet_file = "./etc/pms/admin-wallet.json"

[validation]
min_pow_leading_zero_bits = 0
max_payload_bytes = 65536
min_parents_after_boot = 1
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = false
enforce_fee_recipient = false

# Coordinator public key - ENABLED for Single Writer Mode (uncompressed format)
coordinator_public_key = "049d8208db3c396cb0b6b2931fccae8eeaa4e1326eb973fc4c5f22c426205d6fce1b707874c05fd9ff4ff843ef370b71f631ff4c4221953ea8a09a98573d074b4c"
coordinator_x25519_public_key = "5a36e77f275e92ebce88155a6402bc66c201f8ac825bf540e9fc457ceff6bf17"
