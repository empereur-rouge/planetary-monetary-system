[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:main"           # MAINNET: pms:main | TESTNET: pms:test
tip_limit = 256               # Limite des tips DAG en mémoire
checkpoint_interval_secs = 21600 # 6 heures (défaut)

[network]
mode = "mainnet"              # "dev" | "testnet" | "mainnet"
network_id = "pms-mainnet-v1"
protocol_version = 1

[address]
hrp = "8e"                    # Human-Readable Prefix pour les adresses

[admin]
# Nouveau système de treasury wallets
# Les wallets sont chargés depuis un fichier JSON signé (vérifié contre la clé coordinator)
# Sélection: pseudo-aléatoire pour les frais, premier wallet pour les récompenses de bloc
treasury_wallets_file = "/home/pms/config/treasury-wallets.json"

[client]
# Configuration du serveur/client
bind_addr = "0.0.0.0:8443"           # Adresse P2P TLS
api_addr = "0.0.0.0:8080"            # Adresse API HTTP
allow_insecure_tls = false           # ⚠️  false en production !

[p2p]
known_peers = ""                     # Format: "p2ps://peer1:8443,p2ps://peer2:8443"

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
# ca_pem = "/home/pms/tls/ca-cert.pem"  # Commenté car auto-signé par défaut
whitelist_fp256 = []                  # ✅ NOUVEAU: Fingerprints autorisés (vide = tous)
[limits]
max_body_bytes = 262144               # ✅ NOUVEAU: 256 KB max pour le body
request_timeout_ms = 30000            # 30 secondes timeout
rate_limit_rps = 1000
burst = 2000
[fees]
epsilon = "0.001"                     # Precision epsilon pour calculs
scan_limit = 2000                     # Limite de scan UTXO
mode = "uniform"                      # Mode de distribution des frais
enforce_fee_recipient = true          # Vérifier les destinataires de frais

# Distribution des frais (Treasury Tax + Fee Sharing)
treasury_fee_percent = 15             # 15% vers treasury
creator_fee_percent = 45              # 45% vers créateur du bloc
parents_fee_percent = 40              # 40% réparti entre les parents

# Block Rewards (Inflation)
block_reward = "0.1"                  # PMS par bloc (mettre "0" pour désactiver)
annual_inflation_percent = 3.0        # Inflation annuelle cible
treasury_reward_percent = 20          # 20% de la récompense vers treasury
creator_reward_percent = 70           # 70% de la récompense vers créateur
burn_percent = 10                     # 10% brûlé (pression déflationniste)
# ✅ MODIFIÉ: Liste des clés Authority (remplace authority_public_key)
# Chaque clé représente un backend d'application autorisé à générer des Cubes.
# Format: SEC1 compressed hex (ex: "03..." pour secp256k1)
authority_public_keys = [
    "03XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",  # Backend principale
    # Ajouter d'autres clés si plusieurs backends sont autorisés
]
authority_keys_last_rotation = "2026-01-20"  # ✅ NOUVEAU: Date de dernière rotation
[auth]
require_signed_submit = true          # ✅ NOUVEAU: Exiger signature pour submit
admin_api_token = "env:PMS_ADMIN_TOKEN"  # ✅ MODIFIÉ: Utiliser variable d'environnement
allowed_ips = ["127.0.0.1"]           # IPs autorisées pour /admin/*
[secrets]
node_identity_key_path = "/home/pms/config/pms/node.key"
admin_wallet_file = "/home/pms/config/pms/admin-wallet.json"
[validation]
min_pow_leading_zero_bits = 8         # Difficulté PoW (8 = facile, 16 = dur)
max_payload_bytes = 65536             # ✅ NOUVEAU: 64 KB max payload
min_parents_after_boot = 2            # ✅ NOUVEAU: Parents min après boot (2 pour prod)
max_parents = 8
require_unique_parents = true         # ✅ NOUVEAU: Parents uniques obligatoires
forbid_self_parent = true             # ✅ NOUVEAU: Interdire l'auto-parentage
max_inputs = 64                       # ✅ NOUVEAU: Max inputs par transaction
max_outputs = 64                      # ✅ NOUVEAU: Max outputs par transaction
max_tx_bytes = 65536                  # ✅ NOUVEAU: Max taille transaction
max_fee_per_tx = 1000                 # ✅ NOUVEAU: Max frais par transaction
enforce_parent_existence = true       # ✅ NOUVEAU: Vérifier existence des parents
enforce_fee_recipient = true          # ✅ NOUVEAU: Vérifier destinataire des frais


# ✅ NOUVEAU: Clés du Coordinator (obligatoires pour mainnet/testnet)
# Génère avec: cargo run -p tools-cli -- derive-coordinator --config-path <path>
coordinator_public_key = "03XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
coordinator_x25519_public_key = "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"