# Configuration pour les tests Docker (Testnet mode - Coordinator-only minting)
# Cette config est utilisée par docker_stress_sync.rs

[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:test"
tip_limit = 256
checkpoint_interval_secs = 3600 # 1 heure pour tests

[network]
mode = "testnet"        # TESTNET MODE - Coordinator check enabled
network_id = "pms-test"
protocol_version = 1

[address]
hrp = "8e"

[admin]
# Treasury wallets loaded from signed JSON file (verified against coordinator key)
# Selection: pseudo-random for fees, first wallet for block rewards
treasury_wallets_file = "/home/pms/config/treasury-wallets.json"
# Pubkeys autorisés à mint (Testnet mode l'exige). = clé coordinateur (uncompressed),
# match insensible à la casse contre le signer du bloc Mint.
signer_pubkeys = ["045da509742a0064e36fea6c99d35f871189ad912420734ccff88b6027e7ae940f11f5348b8c5eb3a3999c77e4c7328d1f541aaaddaea88d12828b80c9b6431d04", "0450896e03dd06a9446f9dc5cf3711678bdb87a3a66a937829f40300a82a2d6cc4fcb32935ac85a32f5fd7a882baec982019b7030c7a42d784d10433f2b5f11626"]

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "0.0.0.0:8080"
allow_insecure_tls = true

[p2p]
known_peers = ""

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
ca_pem = "/home/pms/tls/ca-cert.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 262144
request_timeout_ms = 4000
rate_limit_rps = 100000
burst = 200000

[fees]
treasury_addresses = ["pms1sr9zszk0j2mrepljtugrcyexfhpze6nm594sgpchts78crlgx6kfd2q0cfrd5duxmxta79krnhgh7a6w5cuq0j3ghk"]
epsilon = "0.001"
scan_limit = 2000
mode = "uniform"
enforce_fee_recipient = false # Désactivé pour les tests
distribution_interval_sec = 10 # Distribution rapide pour les tests (10s)
# Scheduled Inflation Mint
# Désactivé pour la démo de transfert : en Single-Writer mode chaque bloc doit
# avoir exactement 1 parent, or le service d'inflation injecte des tips
# concurrents qui font que le CLI forge des blocs à 2 parents (rejetés).
daily_inflation_enabled = false
daily_inflation_interval_sec = 60 # 60s pour tester (86400 = 24h en prod)
annual_inflation_percent = 3.0
treasury_reward_percent = 20
creator_reward_percent = 70
burn_percent = 10
[auth]
require_signed_submit = true
admin_api_token = "env:PMS_ADMIN_TOKEN"
api_keys_file = "/home/pms/config/api-keys.json"

[secrets]
node_identity_key_path = "/home/pms/config/node-identity.key"
admin_wallet_file = "/home/pms/config/admin-wallet.json"

[validation]
min_pow_leading_zero_bits = 0    # Désactivé pour les tests (performance)
max_payload_bytes = 65536
min_parents_after_boot = 1       # Réduit pour les tests
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = false # Désactivé pour les tests
enforce_fee_recipient = false    # Désactivé pour les tests

# COORDINATOR PUBLIC KEY - Dérivée de node1.key
# Seul Node 1 peut minter car il a la clé privée correspondante
coordinator_public_key = "045da509742a0064e36fea6c99d35f871189ad912420734ccff88b6027e7ae940f11f5348b8c5eb3a3999c77e4c7328d1f541aaaddaea88d12828b80c9b6431d04"
coordinator_x25519_public_key = "9b58cb508123bb522c5f14dcef6d771ace3fbce4c7d9cebec9aa103d73b74c3c"
