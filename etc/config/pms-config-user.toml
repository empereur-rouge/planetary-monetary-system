# Configuration Utilisateur PMS
# =============================================================================
# Configuration pour un noeud simple (non-coordinateur).
# Pas besoin de clés admin ou treasury.

[rocks]
path = "./data/rocks"
prefix = "pms:main"   # ou pms:test
tip_limit = 256

[network]
mode = "mainnet"              # "testnet" | "mainnet"
network_id = "pms-mainnet-v1"
protocol_version = 1

[address]
hrp = "8e"

[admin]
# Pas de wallet admin/treasury requis pour un noeud simple

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "127.0.0.1:8080" # Écoute locale uniquement par sécurité par défaut
allow_insecure_tls = false

[p2p]
known_peers = "p2ps://node1.pms-network.com:8443" # Exemple de peer

[tls]
# Pour un usage local simple sans HTTPS entrant nécessaire (client only),
# on peut laisser des chemins dummy ou générer des certificats auto-signés.
# En user node, souvent on n'écoute pas en TLS public.
cert_pem = "./tls/cert.pem"
key_pem = "./tls/key.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 100
burst = 200

[fees]
epsilon = "0.001"
mode = "uniform"
# Fee Distribution (Coordinator + Treasury)
coordinator_fee_percent = 65
treasury_fee_percent = 35
distribution_interval_sec = 600 # 10 minutes interval for automatic distribution (Coordinator only)
block_reward = "0.1"
annual_inflation_percent = 3.0

[auth]
require_signed_submit = true
# Token pour l'API locale
admin_api_token = "env:PMS_ADMIN_TOKEN"
allowed_ips = ["127.0.0.1"]

[secrets]
node_identity_key_path = "./node.key"
# admin_wallet_file non requis

[validation]
min_pow_leading_zero_bits = 8
max_payload_bytes = 65536
min_parents_after_boot = 2
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = true
enforce_fee_recipient = true
coordinator_public_key = "03XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
