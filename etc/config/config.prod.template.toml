# Configuration Production PMS
# =============================================================================
# Ce fichier est la config pour le déploiement production.

[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:main"
tip_limit = 256

[network]
mode = "mainnet"
network_id = "pms-mainnet-v1"
protocol_version = 1

[address]
hrp = "8e"

[admin]
wallet_addresses = []

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "0.0.0.0:8080"
allow_insecure_tls = false

[p2p]
known_peers = ""

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 1000
burst = 2000

[fees]
epsilon = "0.001"
mode = "uniform"
# Fee Distribution (Treasury Tax + Fee Sharing)
treasury_fee_percent = 15 # 15% to admin/treasury wallets
creator_fee_percent = 45  # 45% to block creator
parents_fee_percent = 40  # 40% split between parent signers
# Block Rewards (Inflation)
block_reward = "0.1"           # PMS per block (set to "0" to disable)
annual_inflation_percent = 3.0
treasury_reward_percent = 20   # 20% of block reward to treasury
creator_reward_percent = 70    # 70% of block reward to creator
burn_percent = 10              # 10% burned (deflationary pressure)

[auth]
require_signed_submit = true
admin_api_token = "REPLACE_WITH_YOUR_SECRET_TOKEN"
allowed_ips = []

[secrets]
node_identity_key_path = "/home/pms/config/pms/node.key"
admin_wallet_file = "/home/pms/config/pms/admin-wallet.json"

[validation]
min_pow_leading_zero_bits = 8
max_payload_bytes = 65536
min_parents_after_boot = 2
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = true
enforce_fee_recipient = true
coordinator_public_key = ""
