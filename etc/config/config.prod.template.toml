# Configuration Production PMS
# =============================================================================
# Ce fichier est la config pour le déploiement production.

[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:main"
tip_limit = 256

[network]
mode = "mainnet"
network_id = "pms-mainnet-v1"
protocol_version = 1

[address]
hrp = "8e"

[admin]
wallet_addresses = []

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "0.0.0.0:8080"
internal_api_addr = "127.0.0.1:3000"
allow_insecure_tls = false

[p2p]
known_peers = ""
allowed_peer_ips = []
strict_whitelist = true

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 1000
burst = 2000

[fees]
epsilon = "0.001"
mode = "uniform"
# Fee Distribution (Coordinator + Treasury)
coordinator_fee_percent = 65 # 65% to coordinator
treasury_fee_percent = 35    # 35% to treasury wallets
# Scheduled Inflation Mint
daily_inflation_enabled = true
daily_inflation_interval_sec = 86400 # 24h
annual_inflation_percent = 3.0
treasury_reward_percent = 20         # 20% to treasury
creator_reward_percent = 70          # 70% to coordinator
burn_percent = 10                    # 10% burned (not minted)

[auth]
require_signed_submit = true
admin_api_token = "REPLACE_WITH_YOUR_SECRET_TOKEN"
allowed_ips = []
api_keys_file = "/home/pms/config/pms/api-keys.json"

[secrets]
node_identity_key_path = "/home/pms/config/pms/node.key"
admin_wallet_file = "/home/pms/config/pms/coordinator.json"

[validation]
# PoW disabled: In a Private DAG, the server is the final authority.
# Signature validation replaces PoW for block acceptance.
min_pow_leading_zero_bits = 0
max_payload_bytes = 65536
min_parents_after_boot = 2
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = true
enforce_fee_recipient = true
coordinator_public_key = ""

# =============================================================================
# Multi-Ledger (optional)
# =============================================================================
# If no [[ledgers]] section is defined, a single "main" ledger is auto-created
# from [rocks] and [network] settings (backward compatible).
#
# [[ledgers]]
# id = "main"
# network_id = "pms-mainnet-v1"
# prefix = "pms:main"
# protocol_version = 1
#
# [[ledgers]]
# id = "nft"
# network_id = "pms-nft-v1"
# prefix = "nft"
# protocol_version = 1
# [ledgers.fees]
# ratio = "0.01"
