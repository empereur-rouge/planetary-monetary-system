# =============================================================================
# Configuration Testnet PMS (VPS)
# =============================================================================
# Mode TESTNET strict : coordinator requis, signatures obligatoires.
# Faucet actif (non-mainnet). Rate limits eleves pour stress-test simulateur.

[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:test"
tip_limit = 256
max_dag_blocks = 10000           # RAM DAG window (v0.7.1: 50K→10K to reduce baseline from 8→0.6 GiB)
# UTXO LRU cache size. Testnet has ~21K UTXOs. 500K gives ~24x headroom.
# Higher values increase baseline memory without benefit on testnet.
max_utxos = 500000
auto_reindex_activity_items = false  # Disabled: reindex consumes significant memory during bootstrap
checkpoint_interval_secs = 3600
# ── Memory tuning for 16 GB VPS (v0.7.1) ─────────────────────────────────────
# Direct I/O (v0.5.21): kernel page cache bypassed → block_cache is the ONLY read cache.
# CRITICAL: write_buffer_size_mb × max_write_buffer_number × num_CFs = memtable RAM.
# With multi-ledger (2 ledgers × 33 CFs = 67 CFs total), keep ALL values SMALL:
#
#   Memtable budget:  67 CFs × 2 buffers × 16 MB = 2.1 GB max
#   Block cache:      256 MB (holds bloom filters + index blocks + hot data)
#   Flush trigger:    256 MB global (flush eagerly to limit memtable peak)
#
# Observed behavior with 20M blocks across 67 CFs:
#   - Trough: ~6-7 GiB (45-51%), Peak: ~12.4 GiB (89%) during compaction
#   - Compaction cycles: ~2-3 min period, all 8 cores engaged
#   - Stable at ~20 tx/s with game activity (~30 total blocks/s)
#
#  8 GB VPS:  write_buffer=8,   buffers=2, cache=128,  docker mem_limit=7g
# 16 GB VPS:  write_buffer=16,  buffers=2, cache=256,  docker mem_limit=14g
# 32 GB VPS:  write_buffer=32,  buffers=3, cache=1024, docker mem_limit=28g
write_buffer_size_mb = 16        # Per-CF memtable (v0.7.1: 32→16)
max_write_buffer_number = 2      # Per-CF immutable memtables (v0.7.1: 3→2)
block_cache_size_mb = 256        # Shared LRU cache (v0.7.1: 512→256)
db_write_buffer_size_mb = 256    # Global memtable flush trigger (v0.7.1: 512→256)
max_open_files = 4096            # FD limit (ulimit=65536 in docker-compose)

[network]
mode = "testnet"
network_id = "pms-testnet-v1"
protocol_version = 3

[address]
hrp = "8e"

[admin]
wallet_addresses = []
treasury_wallets_file = "/home/pms/config/pms/treasury-wallets.json"

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "0.0.0.0:8080"
internal_api_addr = "0.0.0.0:3000"
allow_insecure_tls = true

[p2p]
known_peers = ""
allowed_peer_ips = []
strict_whitelist = false
# P2P scaling limits (configurable since v0.5.9)
# Increase for vertical scaling (more RAM) or horizontal scaling (more peers)
max_connections = 256           # Max concurrent inbound P2P connections
per_peer_queue_cap = 2000       # Per-peer outbound message queue size
max_orphans = 2000              # Max orphan blocks held in RAM
max_inflight_requests = 10000   # Max in-flight GetBlock requests
max_parent_deps = 5000          # Max parent->child dependency tracking entries
max_peer_retries = 20           # Max connection retry attempts per known peer

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 10000
burst = 20000

[fees]
epsilon = "0.001"
mode = "uniform"
enforce_fee_recipient = false
coordinator_fee_percent = 65
treasury_fee_percent = 35
distribution_interval_sec = 10
# Inflation acceleree pour testnet
daily_inflation_enabled = true
daily_inflation_interval_sec = 120
annual_inflation_percent = 3.0
treasury_reward_percent = 20
creator_reward_percent = 70
burn_percent = 10
# Budget d'emission (plan §3.1) — couloir gouverne.
# Epoch = 120s pour garder une emission frequente time-proportionnelle sur le
# testnet (chaque tick = un epoch ; budget = supply x taux x 120s/an). Sans ca,
# l'epoch par defaut (86400s) ne minterait qu'une fois par jour malgre le tick
# a 120s. annual_ceiling_percent = plafond DUR du couloir (defaut 10%).
emission_epoch_duration_sec = 120
annual_ceiling_percent = 10.0
# Coordinator sub-address sharding (audit follow-up to v0.7.4).
# When > 0, fee outputs are round-robin'd across N HKDF-SHA256-derived
# sub-addresses instead of all landing on the master coordinator
# address — bounds the per-address UTXO accumulation and exposes
# `/v1/coordinator/info::shards` for auditors to sum balances.
# Value 0 = sharding disabled (legacy single-address fee routing).
# Valid range when > 0: [2, 256].
coord_shard_count = 32

[auth]
require_signed_submit = true
admin_api_token = "env:PMS_ADMIN_TOKEN"
allowed_ips = []
api_keys_file = "/home/pms/config/pms/api-keys.json"

[secrets]
node_identity_key_path = "/home/pms/config/pms/node.key"
admin_wallet_file = "/home/pms/config/pms/coordinator.json"

# /healthz thresholds (v0.7.4). All fields have defaults; values below
# are tuned for testnet's mostly-idle baseline + 16 GB VPS profile.
[health]
# Flag /healthz as `degraded` if no block has been persisted in this
# many seconds. 300 = 5 min — long enough to absorb idle quiet periods
# on testnet, short enough to surface a stuck coordinator.
max_last_block_age_seconds = 300
# Flag as `degraded` when the persist channel sits at >=80% capacity.
# Saturation means producers are about to start blocking on send.await.
persist_queue_high_water = 0.8
# Flag when free disk drops below 10% on the RocksDB volume.
min_disk_free_percent = 10.0
# Background activity-index retention (audit follow-up to v0.7.4).
# 30 days is enough for the dashboard's history view; older entries
# are purged daily by `spawn_activity_retention_task`. Compliance log
# is NOT auto-purged — operator-only via `/admin/purge-compliance-log`.
activity_retention_days = 30
# Auto UTXO consolidation (recommendation #5, v0.7.5).
# Periodically rolls up the coordinator master address's UTXOs into a
# single self-transfer once they exceed `auto_consolidate_min_utxos`.
# 600s = every 10 minutes. Disabled (None) on smaller deployments where
# coord_shard_count > 0 already caps per-address accumulation.
auto_consolidate_interval_secs = 600
auto_consolidate_min_utxos = 200
# Resource guard / read-only mode (v0.7.23).
# Background task that flips the engine into read-only when memory,
# disk, or RocksDB cross critical thresholds — preferring a clean 503
# to clients over a Docker SIGKILL that loses the persist queue.
read_only_guard_enabled = true
# Memory hysteresis (% of cgroup memory.max). On the 16 GiB testnet
# VPS with mem_limit=14g, 90% ~= 12.6 GiB used. Compaction on RocksDB
# saw-tooth peaks at ~12.4 GiB so 90% triggers right BEFORE OOM.
memory_high_watermark_pct = 90.0
memory_low_watermark_pct = 75.0
# Disk free percent below which the engine flips read-only. Distinct
# from `min_disk_free_percent` (the /healthz "degraded" signal at 10%);
# read-only kicks in lower so a slow leak first warns, then gates writes.
disk_critical_free_percent = 5.0
# L0 file count above which the engine flips read-only — early-warning
# before RocksDB's hard `level0_stop_writes_trigger` (120, set in
# apply_db_tuning).
rocksdb_l0_critical_files = 100
# Anti-flap floor (v0.7.26): once auto-armed, stay armed at least 60 s
# before allowing auto-disarm. Without this, memtable bursts that trip
# 90% then drop to 75% after a flush would loop the engine in/out of
# read-only every 1-2 minutes (testnet incident 2026-05-01). Manual
# arms ignore this floor and disarm immediately on operator command.
read_only_min_arm_duration_secs = 60
# Persist channel saturation gate (v0.7.27). When the producer-side
# persist_tx mpsc fills past this fraction of capacity, arm read-only
# proactively. Without this, send().await blocks the HTTP handler for
# seconds-to-minutes (testnet 2026-05-01 saw 21s on a single block) —
# returning 503 read_only with Retry-After: 30 is far cleaner. Capacity
# is hardcoded at 2000 in pms-core::core_adapter; 0.8 = 1600 blocks.
persist_queue_critical_pct = 0.8

[validation]
min_pow_leading_zero_bits = 0
max_payload_bytes = 65536
min_parents_after_boot = 1
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = false
enforce_fee_recipient = false
coordinator_public_key = ""
coordinator_x25519_public_key = ""
# ── Preuve de réserves ancrée (protocole 2.6, v0.10.0) ──────────────────
# Désactivée par défaut. Une fois activée, le coordinator ancre toutes les
# `interval_secs` un bloc ReserveSnapshot (state_root SHA-256 du set UTXO +
# supply par asset). Vérification : POST /admin/reserves/verify.
[reserves]
enabled = false
interval_secs = 3600
