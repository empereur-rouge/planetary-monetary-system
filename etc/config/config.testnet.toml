# =============================================================================
# Configuration Testnet PMS (VPS)
# =============================================================================
# Mode TESTNET strict : coordinator requis, signatures obligatoires.
# Faucet actif (non-mainnet). Rate limits eleves pour stress-test simulateur.

[rocks]
path = "/home/pms/data/rocks"
prefix = "pms:test"
tip_limit = 256
max_dag_blocks = 10000           # RAM DAG window (v0.7.1: 50K→10K to reduce baseline from 8→0.6 GiB)
# UTXO LRU cache size. Testnet has ~21K UTXOs. 500K gives ~24x headroom.
# Higher values increase baseline memory without benefit on testnet.
max_utxos = 500000
auto_reindex_activity_items = false  # Disabled: reindex consumes significant memory during bootstrap
checkpoint_interval_secs = 3600
# ── Memory tuning for 16 GB VPS (v0.7.1) ─────────────────────────────────────
# Direct I/O (v0.5.21): kernel page cache bypassed → block_cache is the ONLY read cache.
# CRITICAL: write_buffer_size_mb × max_write_buffer_number × num_CFs = memtable RAM.
# With multi-ledger (2 ledgers × 33 CFs = 67 CFs total), keep ALL values SMALL:
#
#   Memtable budget:  67 CFs × 2 buffers × 16 MB = 2.1 GB max
#   Block cache:      256 MB (holds bloom filters + index blocks + hot data)
#   Flush trigger:    256 MB global (flush eagerly to limit memtable peak)
#
# Observed behavior with 20M blocks across 67 CFs:
#   - Trough: ~6-7 GiB (45-51%), Peak: ~12.4 GiB (89%) during compaction
#   - Compaction cycles: ~2-3 min period, all 8 cores engaged
#   - Stable at ~20 tx/s with game activity (~30 total blocks/s)
#
#  8 GB VPS:  write_buffer=8,   buffers=2, cache=128,  docker mem_limit=7g
# 16 GB VPS:  write_buffer=16,  buffers=2, cache=256,  docker mem_limit=14g
# 32 GB VPS:  write_buffer=32,  buffers=3, cache=1024, docker mem_limit=28g
write_buffer_size_mb = 16        # Per-CF memtable (v0.7.1: 32→16)
max_write_buffer_number = 2      # Per-CF immutable memtables (v0.7.1: 3→2)
block_cache_size_mb = 256        # Shared LRU cache (v0.7.1: 512→256)
db_write_buffer_size_mb = 256    # Global memtable flush trigger (v0.7.1: 512→256)
max_open_files = 4096            # FD limit (ulimit=65536 in docker-compose)

[network]
mode = "testnet"
network_id = "pms-testnet-v1"
protocol_version = 1

[address]
hrp = "8e"

[admin]
wallet_addresses = []
treasury_wallets_file = "/home/pms/config/pms/treasury-wallets.json"

[client]
bind_addr = "0.0.0.0:8443"
api_addr = "0.0.0.0:8080"
internal_api_addr = "0.0.0.0:3000"
allow_insecure_tls = true

[p2p]
known_peers = ""
allowed_peer_ips = []
strict_whitelist = false
# P2P scaling limits (configurable since v0.5.9)
# Increase for vertical scaling (more RAM) or horizontal scaling (more peers)
max_connections = 256           # Max concurrent inbound P2P connections
per_peer_queue_cap = 2000       # Per-peer outbound message queue size
max_orphans = 2000              # Max orphan blocks held in RAM
max_inflight_requests = 10000   # Max in-flight GetBlock requests
max_parent_deps = 5000          # Max parent->child dependency tracking entries
max_peer_retries = 20           # Max connection retry attempts per known peer

[tls]
cert_pem = "/home/pms/tls/cert.pem"
key_pem = "/home/pms/tls/key.pem"
whitelist_fp256 = []

[limits]
max_body_bytes = 1048576
request_timeout_ms = 30000
rate_limit_rps = 10000
burst = 20000

[fees]
epsilon = "0.001"
mode = "uniform"
enforce_fee_recipient = false
coordinator_fee_percent = 65
treasury_fee_percent = 35
distribution_interval_sec = 10
# Inflation acceleree pour testnet
daily_inflation_enabled = true
daily_inflation_interval_sec = 120
annual_inflation_percent = 3.0
treasury_reward_percent = 20
creator_reward_percent = 70
burn_percent = 10

[auth]
require_signed_submit = true
admin_api_token = "env:PMS_ADMIN_TOKEN"
allowed_ips = []
api_keys_file = "/home/pms/config/pms/api-keys.json"

[secrets]
node_identity_key_path = "/home/pms/config/pms/node.key"
admin_wallet_file = "/home/pms/config/pms/coordinator.json"

[validation]
min_pow_leading_zero_bits = 0
max_payload_bytes = 65536
min_parents_after_boot = 1
max_parents = 8
require_unique_parents = true
forbid_self_parent = true
max_inputs = 64
max_outputs = 64
max_tx_bytes = 65536
max_fee_per_tx = 1000
enforce_parent_existence = false
enforce_fee_recipient = false
coordinator_public_key = ""
coordinator_x25519_public_key = ""