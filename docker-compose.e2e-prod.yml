# ═══════════════════════════════════════════════════════════════════════════════
# E2E Production Simulation - Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# This docker-compose setup simulates a production environment for E2E testing:
# - TLS enabled (HTTPS)
# - Gateway + Engine architecture (Single Writer Mode)
# - Authority validation for Cube NFTs
# - Persistent RocksDB storage
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PMS Engine (Coordinator) - INTERNAL ONLY
  # ─────────────────────────────────────────────────────────────────────────────
  pms-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pms-node:e2e-prod
    container_name: pms-engine-e2e
    hostname: pms-engine
    user: "pms"
    environment:
      RUST_LOG: info,pms_server=debug,pms_core=debug
      PMS_CONFIG: /home/pms/config/config.e2e-prod.toml
      PMS_ADMIN_TOKEN: e2e_test_admin_secret
      PMS__LIMITS__RATE_LIMIT_RPS: 100000  # High rate limit for E2E testing
      PMS__LIMITS__BURST: 200000
    volumes:
      - ./etc/config/config.e2e-prod.toml:/home/pms/config/config.e2e-prod.toml:ro
      - ./etc/pms/node.key:/home/pms/config/node-identity.key:ro
      - ./etc/pms/admin-wallet.json:/home/pms/config/admin-wallet.json:ro
      - ./etc/pms/treasury-wallets.json:/home/pms/config/treasury-wallets.json:ro
      - ./secrets/tls:/home/pms/tls:ro
      - rocksdb_e2e_data:/home/pms/data
    # NO PUBLIC PORTS - Internal network only
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - pms-e2e-internal

  # ─────────────────────────────────────────────────────────────────────────────
  # PMS Gateway - PUBLIC ENTRY POINT
  # ─────────────────────────────────────────────────────────────────────────────
  pms-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: pms-gateway:e2e-prod
    container_name: pms-gateway-e2e
    hostname: pms-gateway
    depends_on:
      pms-engine:
        condition: service_healthy
    environment:
      RUST_LOG: info,pms_gateway=debug
      UPSTREAM_URL: https://pms-engine:8080
      LISTEN_ADDR: 0.0.0.0:8443
      TLS_CERT: /app/tls/cert.pem
      TLS_KEY: /app/tls/key.pem
      ADMIN_TOKEN: e2e_test_admin_secret
      RATE_LIMIT_RPS: 100000  # High rate limit for E2E testing
      BURST_SIZE: 200000
    volumes:
      - ./secrets/tls:/app/tls:ro
    ports:
      - "8443:8443"  # PUBLIC - The ONLY exposed port
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8443' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - pms-e2e-internal
      - pms-e2e-public

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  pms-e2e-internal:
    driver: bridge
    internal: true  # No external access - Engine is isolated
  pms-e2e-public:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  rocksdb_e2e_data:
    driver: local
