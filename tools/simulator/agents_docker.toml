# ═══════════════════════════════════════════════════════════════════════════
# Agent definitions for Docker environment — ~250 agents, profils variés
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────
# CASUAL USERS — Transactions PMS modérées + game loop
# 100 agents, 1 tick/s, petits montants, 30% de chance d'envoyer
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 100
interval_ms = 1000
name_prefix = "user"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 5.0
send_probability = 0.3

[agents.game]
enabled = true
cubes_per_agent = 5
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 10.0
edn_send_max_pct = 50.0

# ─────────────────────────────────────────────────────────────────────────
# FAST TRADERS — Micro-transactions rapides, pas de game
# 50 agents, 500ms entre chaque tick, très petits montants, 80% send
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 50
interval_ms = 500
name_prefix = "fast"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.5
send_probability = 0.8

# ─────────────────────────────────────────────────────────────────────────
# MINERS — Game-only, pas d'envoi PMS, focus burn/mint cubes
# 50 agents, 1 tick/s, beaucoup de cubes
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 50
interval_ms = 1000
name_prefix = "miner"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.01
send_probability = 0.0

[agents.game]
enabled = true
cubes_per_agent = 10
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 5.0
edn_send_max_pct = 20.0

# ─────────────────────────────────────────────────────────────────────────
# WHALES — Gros montants, peu fréquents
# 10 agents, 1 tick toutes les 5s, gros envois
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 10
interval_ms = 5000
name_prefix = "whale"

[agents.behavior]
type = "random"
min_amount = 50.0
max_amount = 200.0
send_probability = 0.8

[agents.game]
enabled = true
cubes_per_agent = 20
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 30.0
edn_send_max_pct = 80.0

# ─────────────────────────────────────────────────────────────────────────
# SNIPERS — Très rapides, très petits montants, envoi quasi systématique
# 30 agents, 200ms, micro-tx
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 30
interval_ms = 200
name_prefix = "sniper"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.05
send_probability = 1.0

# ─────────────────────────────────────────────────────────────────────────
# SLOW SAVERS — Peu actifs, gros envois occasionnels + game
# 10 agents, 1 tick toutes les 10s
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 10
interval_ms = 10000
name_prefix = "saver"

[agents.behavior]
type = "random"
min_amount = 10.0
max_amount = 50.0
send_probability = 0.4

[agents.game]
enabled = true
cubes_per_agent = 3
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 40.0
edn_send_max_pct = 90.0

# ─────────────────────────────────────────────────────────────────────────
# OBSERVERS — Monitoring passif
# 2 agents, 1 tick toutes les 3s
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 2
interval_ms = 3000
name_prefix = "obs"

[agents.behavior]
type = "observer"
