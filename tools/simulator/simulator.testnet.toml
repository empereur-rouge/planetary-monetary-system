# =============================================================================
# PMS Simulator — Testnet VPS Configuration
# =============================================================================
# Connects to Gateway via Docker internal DNS.
# Admin token resolved from PMS_ADMIN_TOKEN env var.

agent_files = ["agents_testnet.toml"]

[server]
url = "https://pms-gateway:8443"
admin_token = "env:PMS_ADMIN_TOKEN"
api_key = "env:PMS_API_KEY"
accept_invalid_certs = true

[simulation]
duration_secs = 0
base_tick_ms = 1000
faucet_amount = "100.00"

[simulation.game]
ledger_id = "eden"
network_id = "eden-net"
symbol = "EDN"
divisor = 13700
gas_pool_deposit = "50000"             # PMS deposited into Edenite gas pool (anti-spam, testnet charge)

# Multi-ledger games (recommendation #2, v0.7.5). Uncomment + add
# entries to spread the agent population across N independent EDN-
# equivalent ledgers. Agents pick which game to play via
# `[agents.game].game_index = N` (default 0). When this array is
# non-empty it takes precedence over `[simulation.game]` above.
#
# [[simulation.games]]
# ledger_id = "eden"
# network_id = "eden-net"
# symbol = "EDN"
# divisor = 13700
# gas_pool_deposit = "50000"
#
# [[simulation.games]]
# ledger_id = "arena"
# network_id = "arena-net"
# symbol = "ARN"
# divisor = 13700
# gas_pool_deposit = "20000"

[coordinator]
private_key_hex = "env:PMS_COORDINATOR_KEY"
address = "env:PMS_COORDINATOR_ADDR"

[tui]
enabled = false

[web]
enabled = true
port = 9090
