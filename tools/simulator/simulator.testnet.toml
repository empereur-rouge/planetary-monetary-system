# =============================================================================
# PMS Simulator — Testnet VPS Configuration
# =============================================================================
# Connects to Gateway via Docker internal DNS.
# Admin token resolved from PMS_ADMIN_TOKEN env var.

agent_files = ["agents_testnet.toml"]

[server]
url = "https://pms-gateway:8443"
admin_token = "env:PMS_ADMIN_TOKEN"
api_key = "env:PMS_API_KEY"
accept_invalid_certs = true

[simulation]
duration_secs = 0
base_tick_ms = 1000
faucet_amount = "100.00"
# Number of in-flight requests during agent bootstrap (faucet →
# coordinator-distribute → cube mints). At 1000+ agents the previous
# default of 30 turned bootstrap into a 5-8 min serialised crawl;
# 128 brings it down to ~90 s while staying inside the gateway's
# tightened 500 RPS rate-limit. Bump to 256 for 5K+ agents.
bootstrap_concurrency = 128
# In-process memory watchdog. The simulator polls its own RSS every
# 30 s and gracefully shuts down above this threshold. The 1000-agent
# scenario peaks around ~700 MiB-1 GiB after bootstrap; 1500 keeps
# 500 MiB headroom under the compose `mem_limit: 2g`. Set to 0 to
# disable (cgroup OOM is the backstop).
max_rss_mb = 1500

# 4-ledger production-realistic clicker scenario (v0.7.8+). Each entry
# boots an independent game engine on its own ledger with its own
# EDN-equivalent token + smart contract + gas pool. Clicker agents
# spread across them via `[agents.game].game_index = 0..3` in
# `agents_testnet.toml`. This gives the engine a multi-ledger
# steady-state load that mirrors what the launched game is expected
# to look like at first-week scale.
#
# Single-ledger fallback `[simulation.game]` is kept commented out
# below for reference; uncomment it (and remove the `games` array) to
# revert to the legacy single-ledger shape used pre-v0.7.5.
[[simulation.games]]
ledger_id = "eden"
network_id = "eden-net"
symbol = "EDN"
divisor = 13700
gas_pool_deposit = "50000"

[[simulation.games]]
ledger_id = "arena"
network_id = "arena-net"
symbol = "ARN"
divisor = 13700
gas_pool_deposit = "50000"

[[simulation.games]]
ledger_id = "colosseum"
network_id = "colosseum-net"
symbol = "COL"
divisor = 13700
gas_pool_deposit = "50000"

[[simulation.games]]
ledger_id = "nexus"
network_id = "nexus-net"
symbol = "NEX"
divisor = 13700
gas_pool_deposit = "50000"

# Legacy single-ledger config (pre-v0.7.5). Kept as a working example;
# uncomment + remove the `games` array above to revert.
#
# [simulation.game]
# ledger_id = "eden"
# network_id = "eden-net"
# symbol = "EDN"
# divisor = 13700
# gas_pool_deposit = "50000"

[coordinator]
private_key_hex = "env:PMS_COORDINATOR_KEY"
address = "env:PMS_COORDINATOR_ADDR"

[tui]
enabled = false

[web]
enabled = true
port = 9090
