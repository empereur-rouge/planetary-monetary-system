# =============================================================================
# Agent definitions for Testnet VPS — Single-ledger stability run
# =============================================================================
# CONTEXT (v0.7.17+): consolidated from 4-ledger × 250 clickers down to
# 1 ledger (eden) × 250 clickers. The goal of this scenario is to
# validate long-term stability — the DAG should run for days/weeks
# under a steady, production-shaped load without OOM, persist stalls,
# bloom degradation, or RocksDB write throttle.
#
# DB-LONGEVITY SLOWDOWN (v0.9.1, 2026-06-11): every `interval_ms` below
# was multiplied by 6 (the only wall-clock knob). At the previous
# ~30-40 blk/s the RocksDB volume filled the VPS disk in ~1 week — the
# DAG is immutable, every tx is a block persisted forever, so disk
# growth is linear in blocks/s and there is no on-disk pruning. ÷6
# brings sustained production to ~5-7 blk/s → the disk now lasts
# ~6 weeks instead of ~1, comfortably past the "≥ 1 month" target.
#
# Everything else (mint_per_tick, sends_per_tick, edn_sends_per_tick,
# target_cubes, burn_cooldown_ticks) is TICK-RELATIVE, so scaling the
# interval keeps the exact same load SHAPE — same mint:send:burn ratio,
# same EDN economics per burn — just stretched over 6× the wall clock.
# The `cooldown_ticks × interval_ms > distribution_interval` invariant
# only gets safer when the interval grows.
#
# TARGET LOAD (single eden ledger, post-÷6):
#   - Cube mints   : 250 × 1/min          = ~4.2 blk/s
#   - Cube burns   : 250 × 1/6h           = ~0.012 blk/s (each batch=360 cubes)
#   - EDN sends    : 250 × 0.1/min        = ~0.4 blk/s post-burn windows
#   - PMS sends    : trader+active groups = ~1 blk/s
#   - Spammers     : back-pressured       = ~8 RPS attempted
#   - Total target : ~5-7 blk/s sustained, peak ~10 during burn windows
#
# This is far below the engine's measured ceiling (~10K TPS local
# bench, ~150 blk/s tested at 1119 agents on 4 ledgers). The slack is
# intentional: a stability test should run with comfortable headroom
# so any anomaly is signal, not load saturation.
#
# To fill the disk faster again (shorter run), divide the intervals
# back down. To make it last even longer, multiply them up further.
# Scale agent *population* via the per-group `count` only when this
# baseline has run clean for ≥ 24 h.

# ---------------------------------------------------------------------------
# CLICKERS — main playerbase, mine 1 cube/min on eden, no PMS sends
# 250 agents, 60s tick → ~4.2 mint blk/s steady, ~42 cube burns/hour
# (each clicker fills 360 cubes in 360 ticks = 6h, then batch-burns)
# ---------------------------------------------------------------------------
[[agents]]
count = 250
interval_ms = 60000
name_prefix = "click"

[agents.behavior]
type = "random"
min_amount = 0.0
max_amount = 0.0
send_probability = 0.0
sends_per_tick = 0

[agents.game]
enabled = true
game_index = 0           # eden (the only game)
cubes_per_agent = 0
target_cubes = 360       # burn at 360 cubes (= 6h × 1/min at 60s tick)
mint_per_tick = 1
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 6
burn_cooldown_jitter_pct = 0.5
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# PMS TRADERS — pure PMS economy, no game (50 agents)
# Represents OTC / fiat-on-ramp traffic that doesn't touch the clicker.
# 50 × 0.5 × 1 / 30 = ~0.83 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
count = 50
interval_ms = 30000
name_prefix = "trader"

[agents.behavior]
type = "random"
min_amount = 1.0
max_amount = 50.0
send_probability = 0.5
sends_per_tick = 1

# ---------------------------------------------------------------------------
# ACTIVE PLAYERS — mine + trade PMS (50 agents on eden)
# Power players who do both: mine cubes AND move PMS economically.
# Lighter cube cadence (mint_per_tick=2 → 2/min at 60s tick) + 2 PMS sends/tick.
# 50 × 0.5 × 2 / 60 = ~0.83 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
count = 50
interval_ms = 60000
name_prefix = "active"

[agents.behavior]
type = "random"
min_amount = 0.5
max_amount = 25.0
send_probability = 0.5
sends_per_tick = 2

[agents.game]
enabled = true
game_index = 0
cubes_per_agent = 0
target_cubes = 360
mint_per_tick = 2
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 6
burn_cooldown_jitter_pct = 0.5
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 2

# ---------------------------------------------------------------------------
# SPAMMERS — adversarial flood, no game, fast micro-tx (5 agents)
# 5 × 1.0 × 2 / 1.2 = ~8.3 PMS tx/s attempted. Engine BP + gateway 500
# RPS rate-limit keep them throttled so they don't drown the legitimate
# fleet. Reduced from 10 → 5 for the stability run; spammers stress
# the BP path which is what we want, but more than 5 is gratuitous.
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 1200
name_prefix = "spammer"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.01
send_probability = 1.0
sends_per_tick = 2

# ---------------------------------------------------------------------------
# ADVERSARIAL — invalid sigs / over-balance / malformed / replay
# (3 agents, 6s tick) — keeps the engine's REJECT paths warm.
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 6000
name_prefix = "adversarial"

[agents.behavior]
type = "adversarial"
attacks = ["bad_signature", "over_balance", "malformed_json", "no_auth"]
sends_per_tick = 1

# ---------------------------------------------------------------------------
# OBSERVERS — passive read-only monitoring (3 agents, 60s tick)
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 60000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ---------------------------------------------------------------------------
# COORDINATOR — node bookkeeping (1 agent, 6min tick)
# ---------------------------------------------------------------------------
[[agents]]
count = 1
interval_ms = 360000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
