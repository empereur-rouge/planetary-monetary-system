# =============================================================================
# Agent definitions for Testnet VPS — 100 active users + spammers
# =============================================================================
# REALISTIC SCENARIO (post-v0.7.5): a hundred clickers mining ~6 cubes/minute
# each, burning their stash roughly once per hour, plus a small flood of
# spammers that the engine should throttle through persist back-pressure
# without crashing.
#
# TARGET LOAD: ~20-25 successful blocks/s sustained.
#   - Cube mint blocks   : 100 × 6/min = 10 blk/s (bursty per agent)
#   - PMS sends           : ~4 blk/s (regular users)
#   - Cube burn batches   : ~1.7/min (each batch = ~360 cubes burned)
#   - EDN sends post-burn : ~1.7/min
#   - Spammer attempts    : ~50 RPS (channel BP throttles them down)
#
# MEMORY BUDGET: 16 GB VPS, 14 GiB Docker, 67 RocksDB CFs.
#   - Engine at rest         : ~8 GiB
#   - 20-25 blk/s steady-state: ~10 GiB headroom (proven stable)
#   - 60+ blk/s              : OOM risk
#
# CYCLE MECHANIC (6 cubes/min × 1h cycle, config-only):
#   - interval_ms = 10000      → 10 s tick
#   - cubes_remint_min/max=350/380 → 350-380 cubes batched per cycle
#   - burn_cooldown_ticks = 358 → ≈ 59 min 40 s post-burn pause
#   Cycle: burn → cooldown 1h → mint 350-380 → burn → loop.
#   Average rate = 360 cubes / 60 min = 6 cubes/min/agent ✓
#   ⚠️  The mint is BURSTY (parallel batch every ~1h, not 1-cube-per-10s).
#       For true continuous mining, code change required — see README.

# ---------------------------------------------------------------------------
# CASUAL USERS — bulk of the playerbase, 60% of active users
# 60 agents, 10s tick, 30% PMS send chance, 1 send/tick
# PMS: 60 × 0.3 × 1 / 10 = 1.8 PMS tx/s
# Cubes: 6/min average (bursty 350-380 batches every ~1h)
# ---------------------------------------------------------------------------
[[agents]]
count = 60
interval_ms = 10000
name_prefix = "casual"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 5.0
send_probability = 0.3
sends_per_tick = 1

[agents.game]
enabled = true
cubes_per_agent = 5         # initial seed (burned within first tick)
cubes_remint_min = 350      # ≈ 1h at 6 cubes/min, ±10%
cubes_remint_max = 380
burn_cooldown_ticks = 358   # 358 × 10s = 59m 40s
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# ACTIVE USERS — power players, 40% of active users, faster tick
# 40 agents, 5s tick, 30% PMS send chance, 1 send/tick
# PMS: 40 × 0.3 × 1 / 5 = 2.4 PMS tx/s
# Cubes: same 6/min average — same cycle math but tick=5s, so 716 ticks/h
# ---------------------------------------------------------------------------
[[agents]]
count = 40
interval_ms = 5000
name_prefix = "active"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 10.0
send_probability = 0.3
sends_per_tick = 1

[agents.game]
enabled = true
cubes_per_agent = 5
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 716   # 716 × 5s = 59m 40s — match casual cycle
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# SPAMMERS — adversarial flood, no game, fast micro-tx
# 5 agents, 200ms tick, 100% probability, 2 sends/tick
# Theoretical: 5 × 1.0 × 2 / 0.2 = 50 PMS tx/s attempted.
# Reality: the engine's persist channel back-pressures around ~25-30 blk/s
# total throughput, so spammers throttle themselves through send.await
# blocking. They never crash the engine — just compete for slots.
#
# ⚠️  This validates the BP behaviour. It does NOT exercise the gateway
#     rate-limiter (10K RPS, all spammers share the same docker IP) nor
#     the validation rejection paths (signatures are valid, UTXOs are
#     real). For true "blocked by DAG" testing (invalid sigs, double-
#     spends, malformed payloads), see recommendation #3 in README.
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 200
name_prefix = "spammer"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.01
send_probability = 1.0
sends_per_tick = 2

# ---------------------------------------------------------------------------
# OBSERVERS — passive monitoring (queries only)
# 3 agents, 10s tick
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 10000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ---------------------------------------------------------------------------
# COORDINATOR — node wallet, occasional bookkeeping sends
# 1 agent, 60s tick
# ---------------------------------------------------------------------------
[[agents]]
count = 1
interval_ms = 60000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
