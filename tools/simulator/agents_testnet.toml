# =============================================================================
# Agent definitions for Testnet VPS — Production-realistic clicker load
# =============================================================================
# REAL-CONDITIONS SCENARIO (v0.7.8+): a thousand active clickers spread
# across 4 independent game ledgers, plus a small population of pure
# PMS traders, plus the standard adversarial / spammer / observer
# coverage. The shape mirrors what the launched EDN clicker is expected
# to look like at first-week steady state.
#
# TARGET LOAD (rough back-of-envelope):
#   - Cube mints   : 1000 × 6/min            = 100 blk/s
#   - Cube burns   : 1000 × 1/hour           = ~0.28 blk/s (each batch=360 cubes)
#   - EDN sends    : 1000 × ~0.6/min          = ~10 blk/s post-burn windows
#   - PMS sends    : trader+active groups     = ~6 blk/s
#   - Spammers     : back-pressured           = ~50 RPS attempted
#   - 4 ledgers    : load × 4 (each clicker plays only one but the engine
#                    persists every block from every ledger into the same
#                    process — fee distribution + contract eval per ledger)
#   Total target  : ~120-150 sustained blk/s, peak ~200 blk/s during
#                    bootstrap-and-burn windows.
#
# This is NOT 4K TPS — at 1000 clickers the GAME load alone tops out
# around 100-150 blk/s steady state. Push the `count` fields on the
# clicker groups proportionally to validate higher targets (e.g. 4000
# clickers → ~500 blk/s game load, which combined with PMS spammers
# and multi-ledger contention should approach the 4K TPS engine ceiling).
#
# MEMORY BUDGET: 16 GB VPS, 14 GiB engine container, 67 RocksDB CFs ×
#   (4 game ledgers + main = 5 prefixes) → 5 × 33 = 165 CFs in steady
#   state. With write_buffer_size_mb=16 × max_write_buffer_number=2 ×
#   165 = 5.3 GB headroom on memtables. Engine RSS observed at 11h:
#   ~2.8 GiB on 1 ledger; expect ~8-10 GiB on 5 ledgers. Bump
#   `max_dag_blocks` if RAM headroom shrinks.
#
# CYCLE MECHANIC (progressive mining, v0.7.5+ unchanged):
#   - interval_ms = 10000      → 10 s tick
#   - target_cubes = 360        → burn when inventory hits 360
#   - mint_per_tick = 1         → 6 cubes/min @ 10s tick ✓
#   - burn_cooldown_ticks = 6   → ~60s post-burn for EDN delivery
#   - burn_cooldown_jitter_pct = 0.5 → ±50% spread on cooldown
#
# SCALING DIAL: to dial real-test load up or down, change the per-group
# `count` only — no other field needs touching. The simulator's
# `bootstrap_concurrency` (in `simulator.testnet.toml`) auto-handles
# 1K-10K agent boots without serialising on the funder.

# ---------------------------------------------------------------------------
# CLICKER LEDGER 0 — main eden game (250 agents)
# Pure clicker behaviour: mine 6 cubes/min, burn at 360, EDN-only sends.
# No PMS sends (`send_probability = 0.0`) — these are mobile users
# who only interact with their game token.
# ---------------------------------------------------------------------------
[[agents]]
count = 250
interval_ms = 10000
name_prefix = "click0"

[agents.behavior]
type = "random"
min_amount = 0.0
max_amount = 0.0
send_probability = 0.0
sends_per_tick = 0

[agents.game]
enabled = true
game_index = 0
cubes_per_agent = 0
target_cubes = 360
mint_per_tick = 1
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 6
burn_cooldown_jitter_pct = 0.5
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

