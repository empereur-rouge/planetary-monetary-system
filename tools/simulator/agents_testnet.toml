# 3 agents, 20s/tick
# PMS: 3 × 0.3 × 2 / 20 = 0.09 PMS tx/s
# EDN: edn_sends_per_tick = 2, cooldown = 2 (40s > 10s distrib)
# ---------------------------------------------------------------------------
[[agents]]
