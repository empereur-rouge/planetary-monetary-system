# ---------------------------------------------------------------------------
# PMS TRADERS — pure PMS economy, no game (50 agents)
# These represent users who buy/sell PMS but don't play the clicker:
# OTC-style transfers, fiat off-ramp settlements, exchange flows.
# 50 × 0.5 × 1 / 5 = 5 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
count = 50
interval_ms = 5000
name_prefix = "trader"

[agents.behavior]
type = "random"
min_amount = 1.0
max_amount = 50.0
send_probability = 0.5
sends_per_tick = 1

# ---------------------------------------------------------------------------
# ACTIVE PLAYERS — mine + trade PMS (50 agents, on ledger 0)
# Power players who do both: mine cubes AND move PMS economically.
# Lighter cube cadence (mint_per_tick=2 → 12/min) + 2 PMS sends/tick.
# Helps stress the cross-ledger contract evaluation path.
# ---------------------------------------------------------------------------
[[agents]]
count = 50
interval_ms = 10000
name_prefix = "active"

[agents.behavior]
type = "random"
min_amount = 0.5
max_amount = 25.0
send_probability = 0.5
sends_per_tick = 2

[agents.game]
enabled = true
game_index = 0
cubes_per_agent = 0
target_cubes = 360
mint_per_tick = 2
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 6
burn_cooldown_jitter_pct = 0.5
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 2

# ---------------------------------------------------------------------------
# SPAMMERS — adversarial flood, no game, fast micro-tx (10 agents)
# 10 × 1.0 × 2 / 0.2 = 100 PMS tx/s attempted. Engine's persist channel
# back-pressure plus gateway rate limit (500 RPS post-v0.7.6) keep
# them in their lane while letting the legitimate fleet through.
# ---------------------------------------------------------------------------
[[agents]]
count = 10
interval_ms = 200
name_prefix = "spammer"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.01
send_probability = 1.0
sends_per_tick = 2

# ---------------------------------------------------------------------------
# ADVERSARIAL — invalid-signature / over-balance / malformed / replay
# (5 agents, 1s tick) — validates the engine's REJECT paths.
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 1000
name_prefix = "adversarial"

[agents.behavior]
type = "adversarial"
attacks = ["bad_signature", "over_balance", "malformed_json", "no_auth"]
sends_per_tick = 1

# ---------------------------------------------------------------------------
# OBSERVERS — passive monitoring (3 agents, 10s tick)
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 10000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ---------------------------------------------------------------------------
# COORDINATOR — node bookkeeping (1 agent, 60s tick)
# ---------------------------------------------------------------------------
[[agents]]
count = 1
interval_ms = 60000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
