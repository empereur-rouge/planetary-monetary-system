interval_ms = 10000
name_prefix = "whale"

[agents.behavior]
type = "random"
min_amount = 50.0
max_amount = 200.0
send_probability = 0.5
sends_per_tick = 2

[agents.game]
enabled = true
cubes_per_agent = 10
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 30.0
edn_send_max_pct = 80.0
burn_cooldown_ticks = 3
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# SNIPERS — Fast micro-tx, systematic
# 3 agents, 2s/tick, 100% send, 3 sends/tick
# PMS: 3 × 1.0 × 3 / 2 = 4.5 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
