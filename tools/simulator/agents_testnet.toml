# =============================================================================
# Agent definitions for Testnet VPS — ~30 agents, ~20 tx/s sustained
# =============================================================================
# MEMORY BUDGET: 16 GB VPS with 14 GiB Docker limit, 67 RocksDB CFs.
# Engine at rest: ~8 GiB (DAG bootstrap + RocksDB metadata + jemalloc retention).
# Headroom: ~6 GiB for write pressure. Back-pressure (v0.7.1) slows API callers
# when persist pipeline is full, but RocksDB internal buffers still grow under load.
#
# Proven stable: 0 tx/s = ~8 GiB, ~20 tx/s = ~10 GiB (target), ~60 tx/s = OOM.
# Keep total PMS tx/s ≤ 20, game blocks add ~10 blk/s → total ~30 blk/s.

# ---------------------------------------------------------------------------
# CASUAL USERS — PMS + game loop
# 8 agents, 3s/tick, 30% chance, 1 send/tick
# PMS: 8 × 0.3 × 1 / 3 = 0.8 PMS tx/s
# EDN: edn_sends_per_tick = 1, cooldown = 10 (30s > 10s distrib)
# ---------------------------------------------------------------------------
[[agents]]
count = 8
interval_ms = 3000
name_prefix = "user"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 5.0
send_probability = 0.3
sends_per_tick = 1

[agents.game]
enabled = true
cubes_per_agent = 3
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 10.0
edn_send_max_pct = 50.0
burn_cooldown_ticks = 10
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# FAST TRADERS — Micro-transactions, no game
# 5 agents, 2s/tick, 50% send, 2 sends/tick
# PMS: 5 × 0.5 × 2 / 2 = 2.5 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 2000
name_prefix = "fast"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.5
send_probability = 0.5
sends_per_tick = 2

# ---------------------------------------------------------------------------
# MINERS — Game-only, no PMS sends, focus cubes
# 5 agents, 2s/tick
# EDN: edn_sends_per_tick = 2, cooldown = 10 (20s > 10s distrib)
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 2000
name_prefix = "miner"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.01
send_probability = 0.0

[agents.game]
enabled = true
cubes_per_agent = 5
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 5.0
edn_send_max_pct = 20.0
burn_cooldown_ticks = 10
edn_sends_per_tick = 2

# ---------------------------------------------------------------------------
# WHALES — Large amounts, infrequent + game
# 3 agents, 10s/tick
# PMS: 3 × 0.5 × 2 / 10 = 0.3 PMS tx/s
# EDN: edn_sends_per_tick = 1, cooldown = 3 (30s > 10s distrib)
