# ---------------------------------------------------------------------------
# OBSERVERS — Passive monitoring
# 2 agents, 5s/tick
# ---------------------------------------------------------------------------
[[agents]]
count = 2
interval_ms = 5000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ---------------------------------------------------------------------------
# COORDINATOR — Node wallet, sends 0.1-1 PMS every minute
# 1 agent, 60s/tick, no faucet (funded by fees)
# ---------------------------------------------------------------------------
[[agents]]
count = 1
interval_ms = 60000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
