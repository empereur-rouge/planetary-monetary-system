# =============================================================================
# Agent definitions for Testnet VPS — 100 active users + spammers
# =============================================================================
# REALISTIC SCENARIO (post-v0.7.5): a hundred clickers mining ~6 cubes/minute
# each, burning their stash roughly once per hour, plus a small flood of
# spammers that the engine should throttle through persist back-pressure
# without crashing.
#
# TARGET LOAD: ~20-25 successful blocks/s sustained.
#   - Cube mint blocks   : 100 × 6/min = 10 blk/s (bursty per agent)
#   - PMS sends           : ~4 blk/s (regular users)
#   - Cube burn batches   : ~1.7/min (each batch = ~360 cubes burned)
#   - EDN sends post-burn : ~1.7/min
#   - Spammer attempts    : ~50 RPS (channel BP throttles them down)
#
# MEMORY BUDGET: 16 GB VPS, 14 GiB Docker, 67 RocksDB CFs.
#   - Engine at rest         : ~8 GiB
#   - 20-25 blk/s steady-state: ~10 GiB headroom (proven stable)
#   - 60+ blk/s              : OOM risk
#
# CYCLE MECHANIC (progressive mining, v0.7.5+):
#   - interval_ms = 10000      → 10 s tick
#   - target_cubes = 360        → burn when inventory hits 360
#   - mint_per_tick = 1         → 1 cube minted per tick (= 6/min @ 10s tick) ✓
#   - burn_cooldown_ticks = 6   → ~60s after burn for EDN delivery
#   - burn_cooldown_jitter_pct = 0.5 → ±50% spread on cooldown to
#     desynchronise the fleet (otherwise 100 agents burn on the same tick).
#   Cycle: mint 1 cube every tick × 360 ticks (~60 min) → burn 360 →
#          ~30-90 s cooldown (jittered) → EDN sends → resume mining.
#   Pre-v0.7.5 the mint was bursty (one parallel 350-380 batch per
#   ~hour); progressive mode produces a continuous stream.

# ---------------------------------------------------------------------------
# CASUAL USERS — bulk of the playerbase, 60% of active users
# 60 agents, 10s tick, 30% PMS send chance, 1 send/tick
# PMS: 60 × 0.3 × 1 / 10 = 1.8 PMS tx/s
# Cubes: 6/min average (bursty 350-380 batches every ~1h)
# ---------------------------------------------------------------------------
[[agents]]
count = 60
interval_ms = 10000
name_prefix = "casual"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 5.0
send_probability = 0.3
sends_per_tick = 1

[agents.game]
enabled = true
cubes_per_agent = 0          # no initial seed in progressive mode
target_cubes = 360           # burn at 360 cubes (= 1h × 6/min)
mint_per_tick = 1            # 1 cube/tick × 10s tick = 6/min ✓
cubes_remint_min = 350       # legacy fields kept for back-compat / fallback
cubes_remint_max = 380
burn_cooldown_ticks = 6      # ~60s post-burn for EDN delivery
burn_cooldown_jitter_pct = 0.5  # ±50% spread (3-9 ticks = 30-90s)
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# ACTIVE USERS — power players: same 6 cubes/min cube cadence (gameplay
# is identical) but more PMS economic activity (larger sends, higher
# probability, multiple sends per tick).
# 40 agents, 10s tick (matches casual to keep cube rate constant),
# 50% PMS send chance, 2 sends/tick
# PMS: 40 × 0.5 × 2 / 10 = 4.0 PMS tx/s
# ---------------------------------------------------------------------------
[[agents]]
count = 40
interval_ms = 10000
name_prefix = "active"

[agents.behavior]
type = "random"
min_amount = 0.5
max_amount = 25.0
send_probability = 0.5
sends_per_tick = 2

[agents.game]
enabled = true
cubes_per_agent = 0
target_cubes = 360           # same 1h × 6/min cycle as casual
mint_per_tick = 1
cubes_remint_min = 350
cubes_remint_max = 380
burn_cooldown_ticks = 6
burn_cooldown_jitter_pct = 0.5
edn_send_min_pct = 30
edn_send_max_pct = 70
edn_sends_per_tick = 1

# ---------------------------------------------------------------------------
# SPAMMERS — adversarial flood, no game, fast micro-tx
# 5 agents, 200ms tick, 100% probability, 2 sends/tick
# Theoretical: 5 × 1.0 × 2 / 0.2 = 50 PMS tx/s attempted.
# Reality: the engine's persist channel back-pressures around ~25-30 blk/s
# total throughput, so spammers throttle themselves through send.await
# blocking. They never crash the engine — just compete for slots.
#
# ⚠️  This validates the BP behaviour. It does NOT exercise the gateway
#     rate-limiter (10K RPS, all spammers share the same docker IP) nor
#     the validation rejection paths (signatures are valid, UTXOs are
#     real). For true "blocked by DAG" testing (invalid sigs, double-
#     spends, malformed payloads), see recommendation #3 in README.
# ---------------------------------------------------------------------------
[[agents]]
count = 5
interval_ms = 200
name_prefix = "spammer"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.01
send_probability = 1.0
sends_per_tick = 2

# ---------------------------------------------------------------------------
# ADVERSARIAL — validates the engine's REJECT paths (recommendation #3)
# 3 agents, 1s tick, 1 attack per tick
# Each tick picks a random attack from the list — invalid signatures,
# over-balance, malformed JSON, no auth header, replay. Counts response
# codes in pms_simulator_tx_failed_total{kind="adversarial:*", reason=...}.
# Pair with the legitimate `spammer` group above to stress both rate-
# limit (back-pressure) AND validation pipeline simultaneously.
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 1000
name_prefix = "adversarial"

[agents.behavior]
type = "adversarial"
attacks = ["bad_signature", "over_balance", "malformed_json", "no_auth"]
sends_per_tick = 1

# ---------------------------------------------------------------------------
# OBSERVERS — passive monitoring (queries only)
# 3 agents, 10s tick
# ---------------------------------------------------------------------------
[[agents]]
count = 3
interval_ms = 10000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ---------------------------------------------------------------------------
# COORDINATOR — node wallet, occasional bookkeeping sends
# 1 agent, 60s tick
# ---------------------------------------------------------------------------
[[agents]]
count = 1
interval_ms = 60000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
