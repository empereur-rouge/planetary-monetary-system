# ===============================================================================
# PMS Simulator — Docker Configuration
# ===============================================================================
# Uses Docker service names for networking (pms-gateway, not localhost)

# Agent definitions in external files
agent_files = ["agents_docker.toml"]

[server]
url = "https://pms-gateway:8443"       # Docker internal DNS
admin_token = "pms_admin_secret"
accept_invalid_certs = true             # Self-signed TLS between containers

# [gemini]
# Decommenter pour agents "smart" (IA). Necessite OAuth token cache monte.
# client_id = "..."
# client_secret = "..."
# model = "gemini-2.0-flash"

[simulation]
duration_secs = 0                       # 0 = run forever (stop via docker stop)
base_tick_ms = 1000
faucet_amount = "50.00"                 # PMS fauceted to each agent at startup

[simulation.game]
ledger_id = "eden"
network_id = "eden-net"
symbol = "EDN"
divisor = 13700
gas_pool_deposit = "10000"             # PMS deposited into Edenite gas pool (anti-spam)

[tui]
enabled = false                         # No terminal in Docker

[web]
enabled = true
port = 9090                             # Exposed via docker-compose ports

