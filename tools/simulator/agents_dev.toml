# ═══════════════════════════════════════════════════════════════════════════
# Agent definitions for dev environment — ~250 agents, profils variés
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────
# CASUAL USERS — Transactions PMS modérées + game loop
# 100 agents, 1 tick/s, petits montants, 30% de chance d'envoyer
# PMS: sends_per_tick = 5 → 100 × 0.3 × 5 = 150 PMS tx/s
# EDN: edn_sends_per_tick = 5, cooldown = 15 (15s > 10s distrib)
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 100
interval_ms = 1000
name_prefix = "user"

[agents.behavior]
type = "random"
min_amount = 0.1
max_amount = 5.0
send_probability = 0.3
sends_per_tick = 5

[agents.game]
enabled = true
cubes_per_agent = 5
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 10.0
edn_send_max_pct = 50.0
burn_cooldown_ticks = 15
edn_sends_per_tick = 5

# ─────────────────────────────────────────────────────────────────────────
# FAST TRADERS — Micro-transactions rapides, pas de game
# 50 agents, 500ms entre chaque tick, très petits montants, 80% send
# sends_per_tick = 15 → 50 × 0.8/0.5s × 15 = 1200 PMS tx/s
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 50
interval_ms = 500
name_prefix = "fast"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.5
send_probability = 0.8
sends_per_tick = 15

# ─────────────────────────────────────────────────────────────────────────
# MINERS — Game-only, pas d'envoi PMS, focus burn/mint cubes
# 50 agents, 1 tick/s, beaucoup de cubes
# EDN: edn_sends_per_tick = 10, cooldown = 15 (15s > 10s distrib)
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 50
interval_ms = 1000
name_prefix = "miner"

[agents.behavior]
type = "random"
min_amount = 0.01
max_amount = 0.01
send_probability = 0.0

[agents.game]
enabled = true
cubes_per_agent = 10
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 5.0
edn_send_max_pct = 20.0
burn_cooldown_ticks = 15
edn_sends_per_tick = 10

# ─────────────────────────────────────────────────────────────────────────
# WHALES — Gros montants, peu fréquents
# 10 agents, 1 tick toutes les 5s, gros envois
# PMS: sends_per_tick = 3 → 10 × 0.8/5s × 3 = 4.8 PMS tx/s
# EDN: edn_sends_per_tick = 3, cooldown = 5 (5×5s=25s > 10s distrib)
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 10
interval_ms = 5000
name_prefix = "whale"

[agents.behavior]
type = "random"
min_amount = 50.0
max_amount = 200.0
send_probability = 0.8
sends_per_tick = 3

[agents.game]
enabled = true
cubes_per_agent = 20
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 30.0
edn_send_max_pct = 80.0
burn_cooldown_ticks = 5
edn_sends_per_tick = 3

# ─────────────────────────────────────────────────────────────────────────
# SNIPERS — Très rapides, très petits montants, envoi quasi systématique
# 30 agents, 200ms, micro-tx
# sends_per_tick = 20 → 30 × 1.0/0.2s × 20 = 3000 PMS tx/s
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 30
interval_ms = 200
name_prefix = "sniper"

[agents.behavior]
type = "random"
min_amount = 0.001
max_amount = 0.05
send_probability = 1.0
sends_per_tick = 20

# ─────────────────────────────────────────────────────────────────────────
# SLOW SAVERS — Peu actifs, gros envois occasionnels + game
# 10 agents, 1 tick toutes les 10s
# PMS: sends_per_tick = 5 → 10 × 0.4/10s × 5 = 2 PMS tx/s
# EDN: edn_sends_per_tick = 5, cooldown = 3 (3×10s=30s > 10s distrib)
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 10
interval_ms = 10000
name_prefix = "saver"

[agents.behavior]
type = "random"
min_amount = 10.0
max_amount = 50.0
send_probability = 0.4
sends_per_tick = 5

[agents.game]
enabled = true
cubes_per_agent = 3
cubes_remint_min = 80
cubes_remint_max = 120
edn_send_min_pct = 40.0
edn_send_max_pct = 90.0
burn_cooldown_ticks = 3
edn_sends_per_tick = 5

# ─────────────────────────────────────────────────────────────────────────
# OBSERVERS — Monitoring passif
# 2 agents, 1 tick toutes les 3s
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 2
interval_ms = 3000
name_prefix = "obs"

[agents.behavior]
type = "observer"

# ─────────────────────────────────────────────────────────────────────────
# COORDINATOR — Wallet du noeud, envoie 0.1-1 PMS chaque minute
# 1 agent, 60s entre chaque tick, pas de faucet (financé par les fees)
# Nécessite [coordinator] dans simulator.dev.toml (commenté par défaut)
# ─────────────────────────────────────────────────────────────────────────
[[agents]]
count = 1
interval_ms = 60000
name_prefix = "coordinator"

[agents.behavior]
type = "coordinator"
min_amount = 0.1
max_amount = 1.0
send_probability = 1.0
