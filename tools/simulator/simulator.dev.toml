# Agent definitions in external files
agent_files = ["agents_dev.toml"]

[server]
url = "https://127.0.0.1:8443"    # Gateway URL (pas l'engine direct)
admin_token = "dev-token"
# ledger_id = "main"              # Decommenter pour multi-ledger
accept_invalid_certs = true        # Dev avec TLS self-signed

# [gemini]
# Decommenter et configurer pour utiliser des agents "smart" (IA)
# client_id = "..."
# client_secret = "..."
# model = "gemini-2.0-flash"

[simulation]
duration_secs = 300                # 5 min, 0 = infini
base_tick_ms = 1000
faucet_amount = "50.00"            # PMS fauceted to each agent at startup

[simulation.game]
ledger_id = "eden"
network_id = "eden-net"
symbol = "EDN"
divisor = 19300000000

# [coordinator]
# private_key_hex = "votre_cle_hex_64_chars"
# address = "8e1..."

[tui]
refresh_ms = 250
enabled = true

[web]
enabled = true
port = 9090                            # http://localhost:9090

