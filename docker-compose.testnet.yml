# =============================================================================
# Testnet Docker Compose — Engine + Gateway + Caddy + Prometheus + Simulator
# =============================================================================
#
# Architecture:
#   Internet -> Caddy (80/443, Let's Encrypt on testnet.pms-network.com)
#                -> Gateway (8443, self-signed TLS interne)
#                    -> Engine (8080, HTTPS self-signed TLS interne)
#              Prometheus (9091, localhost only)
#              Simulator -> Gateway (8443, Docker internal DNS)
#                Web Dashboard (9090, public)
#
# Usage:
#   PMS_ADMIN_TOKEN=xxx docker compose -f docker-compose.testnet.yml up -d
#
# Images are built LOCALLY and transferred via docker load.
# No build happens on the VPS. See scripts/deploy-testnet.sh.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PMS Engine (Coordinator) — INTERNAL ONLY
  # ---------------------------------------------------------------------------
  pms-engine:
    image: pms-node:testnet
    container_name: pms-engine-testnet
    hostname: pms-engine
    user: "pms"
    mem_limit: 14g
    memswap_limit: 14g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      RUST_LOG: info,pms_server=info,pms_core=info
      PMS_CONFIG: /home/pms/config/config.testnet.toml
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN}"
      # Optional: passphrase for the encrypted-at-rest coordinator key.
      # Required when `[secrets].node_identity_key_encrypted_path` is set
      # in config.testnet.toml — the engine reads this to AES-GCM-decrypt
      # node.key.enc at boot. Source it from a secret manager / .env /
      # vault — never commit. Empty / unset is fine when the deployment
      # uses the legacy plain `node.key`.
      PMS_COORDINATOR_KEY_PASSPHRASE: "${PMS_COORDINATOR_KEY_PASSPHRASE:-}"
      # v0.8.3: tame jemalloc + THP fragmentation. Diagnostic 2026-05-13
      # (4d uptime, v0.8.2) showed 4.58 GiB of anon_thp holding memory
      # the workload no longer needed — engine RSS climbed 5.5 → 8.5 GiB
      # over 4 days while producer == consumer (no leak), forcing read-
      # only flap as RSS approached the 14 GiB cgroup limit. Restart
      # freed 2.9 GiB instantly, confirming THP fragmentation.
      #
      #   - background_thread:true    — run jemalloc's purge worker so
      #     pages get released without waiting for a sync call.
      #   - dirty_decay_ms:30000      — return dirty (recently freed)
      #     pages to the OS after 30 s instead of jemalloc's default
      #     10 s muzzy + indefinite hold under load.
      #   - muzzy_decay_ms:30000      — same for muzzy pages.
      #   - metadata_thp:auto         — keep THP for jemalloc metadata
      #     only (small, hot); user allocations use 4K pages so the
      #     half-empty 2 MB huge pages we saw can't accumulate.
      MALLOC_CONF: "background_thread:true,dirty_decay_ms:30000,muzzy_decay_ms:30000,metadata_thp:auto"
    command: ["--config", "/home/pms/config/config.testnet.toml"]
    volumes:
      - ./etc/config:/home/pms/config:rw
      - ./etc/pms:/home/pms/config/pms:rw
      - ./secrets/tls:/home/pms/tls:ro
      - rocksdb_testnet_data:/home/pms/data
    expose:
      - "8080"
    # Real-content healthcheck against `/healthz` (v0.7.4): returns 200
    # when RocksDB is writable, the persist queue is healthy, the last
    # block is recent, and the disk has free space; 503 (degraded|fail)
    # otherwise. The previous TCP-port probe accepted the engine as
    # healthy as long as the listener was alive, masking real
    # degradation. `start_period: 300s` covers cold-boot RAM bootstrap
    # of the DAG (large DBs take a while to replay).
    #
    # v0.7.28: timeout 5s → 15s, interval 10s → 30s. The `/healthz`
    # handler does several RocksDB property reads (block count, last
    # block age, disk free, persist queue depth) that can take >5 s
    # under burst load — we observed `Up X (unhealthy)` flapping on
    # 2026-05-02 with 10 consecutive timeouts during a burst window
    # while the engine itself was perfectly fine (logs show normal
    # block production, public /healthz returned 200 OK fast on a
    # direct curl). A 15 s timeout + 30 s interval gives the handler
    # enough breathing room without weakening the underlying signal.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -f --max-time 15 https://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    networks:
      - pms-testnet-internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PMS Gateway — Auth/RateLimit/Public Routes
  # ---------------------------------------------------------------------------
  pms-gateway:
    image: pms-gateway:testnet
    container_name: pms-gateway-testnet
    hostname: pms-gateway
    mem_limit: 512m
    memswap_limit: 512m
    # 1119 simulator agents + dashboard clients × multiple HTTP/2
    # streams quickly burns through the default 1024 fd limit (each
    # active connection to the upstream pms-engine = 1 fd, plus
    # inbound sockets, plus log files). Without this ulimit the
    # gateway hits "Too many open files (os error 24)" under
    # production-realistic load and starts returning 502 to dashboard
    # API calls — observed 2026-04-28. Match the engine's 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      pms-engine:
        condition: service_healthy
    environment:
      RUST_LOG: info,pms_gateway=info
      UPSTREAM_URL: https://pms-engine:8080
      LISTEN_ADDR: 0.0.0.0:8443
      TLS_CERT: /app/tls/cert.pem
      TLS_KEY: /app/tls/key.pem
      ADMIN_TOKEN: "${PMS_ADMIN_TOKEN}"
      DASHBOARD_PATH: /app/dashboard
      # Per-IP rate limit at the gateway. Tightened from 50K → 500 RPS
      # so the simulator's adversarial flood scenario actually trips the
      # 429 path (5 spammers × 50 RPS share the same docker IP and now
      # add up against a meaningful ceiling). 100-user legitimate load
      # peaks at ~150-300 RPS during cube-mint bursts so 500/1000 keeps
      # them inside the budget. For a more granular per-API-key limit,
      # see recommendation #4 in CHANGELOG (requires gateway code change).
      RATE_LIMIT_RPS: 500
      BURST_SIZE: 1000
      # v0.30.2 — DoS au bord public : timeout par requete (→ 408) + plafond
      # de concurrence in-flight. Ne coupent pas les flux SSE (le handler
      # retourne des l'arrivee des headers amont).
      REQUEST_TIMEOUT_MS: 30000
      MAX_CONCURRENT: 512
      # v0.30.3 — anti-slowloris : ferme les connexions dont les headers
      # n'arrivent pas à temps (chemin TLS). Caddy le fait deja au bord.
      HEADER_READ_TIMEOUT_MS: 15000
      SERVICES_MONITOR: "Engine|https://pms-engine:8080/internal/health|ok,Prometheus|http://prometheus:9090/-/healthy|,Simulator|http://pms-simulator:9090/|,Caddy|http://caddy:80|"
      SERVICES_CHECK_INTERVAL: "20"
    volumes:
      - ./secrets/tls:/app/tls:ro
    expose:
      - "8443"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8443' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - pms-testnet-internal
      - pms-testnet-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Caddy — TLS termination + Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy-testnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.testnet:/etc/caddy/Caddyfile:ro
      - caddy_testnet_data:/data
      - caddy_testnet_config:/config
    depends_on:
      pms-gateway:
        condition: service_healthy
    networks:
      - pms-testnet-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics (localhost only)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pms-prometheus-testnet
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules — referenced by `rule_files:` in prometheus.yml.
      # Without this mount the rules silently never load (groups: []
      # in the API response) and no alerts ever fire. Bit us
      # 2026-04-29 right after wiring cAdvisor.
      - ./etc/prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      # Admin token mounted as a one-line file. Prometheus reads it via
      # `credentials_file: /etc/prometheus/admin_token` in the scrape
      # config to authenticate `/metrics/all` (the engine's full
      # registry sits behind `require_local_or_admin` middleware, and
      # Prometheus's container IP isn't loopback). The file is created
      # by `scripts/deploy-testnet.sh` from `$PMS_ADMIN_TOKEN`.
      - ./secrets/prometheus_admin_token:/etc/prometheus/admin_token:ro
      - prometheus_testnet_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=1GB'
    networks:
      # Internal: scrape engine + gateway via internal DNS.
      - pms-testnet-internal
      # Public: scrape simulator (which lives on the public network so
      # the dashboard at :9090 is exposed). Without this, Prometheus
      # can't resolve `pms-simulator` and the pms-simulator scrape
      # target stays in DOWN state with a DNS lookup error.
      - pms-testnet-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Alertmanager — Routes Prometheus alerts to webhook receivers
  # ---------------------------------------------------------------------------
  # Stays loopback-only by default (paging happens via outbound webhooks
  # to Better Uptime / PagerDuty / Slack — no inbound traffic needed).
  # The `alertmanager.yml` ships with placeholder URLs; alerts are
  # silently dropped until the operator wires real integrations.
  # See `documentation/runbooks/alerting.md` for setup.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pms-alertmanager-testnet
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./etc/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Telegram bot token mounted as a one-line file. Alertmanager
      # reads it via `bot_token_file:` in `telegram_configs` so the
      # token never appears in alertmanager.yml (which is checked into
      # git). The file lives in `secrets/telegram_bot_token` on the
      # host (gitignored) — `scripts/deploy-testnet.sh` creates a
      # placeholder if missing so the service starts cleanly. Replace
      # the placeholder with the real bot token from @BotFather to
      # activate paging.
      - ./secrets/telegram_bot_token:/etc/alertmanager/telegram_bot_token:ro
      - alertmanager_testnet_data:/alertmanager
    ports:
      # Loopback-only — operator can SSH-tunnel to inspect / silence
      # alerts. Outbound to webhook providers does not need any port
      # open on the VPS.
      - "127.0.0.1:9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
      - '--cluster.listen-address='
    networks:
      # Internal so prometheus can resolve `alertmanager:9093` for the
      # `alerting:` section + the self-scrape job.
      - pms-testnet-internal
      # Public so alertmanager can reach external paging APIs
      # (api.telegram.org, hooks.slack.com, betterstack.com, etc.).
      # Without this the internal network's `internal: true` flag
      # blocks all outbound Internet → notifications never deliver
      # and you see `lookup api.telegram.org on 127.0.0.11:53: server
      # misbehaving` in the alertmanager logs.
      - pms-testnet-public
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # cAdvisor — Container-level cgroup metrics for Prometheus
  # ---------------------------------------------------------------------------
  # The Rust prometheus client doesn't auto-expose `process_resident_memory_bytes`
  # (that's a Go-isms). Without cAdvisor the EngineMemoryHigh alert silently
  # never fires — bit us 2026-04-29 when the engine grew to 12.67 GiB without
  # any paging. cAdvisor reads cgroup stats directly and exposes them as
  # `container_memory_rss{name=...}`, `container_memory_usage_bytes{name=...}`,
  # `container_oom_events_total{name=...}`, etc. — so memory alerts work even
  # without per-binary instrumentation.
  cadvisor:
    # v0.52.1 — v0.49.x ships with a Docker client pinned at API 1.41
    # which is rejected by Docker daemons ≥ 25 (the testnet VPS runs
    # 29.1.3, server API 1.52). Without per-container Docker labels
    # only the system-wide cgroup root series comes through, breaking
    # all `name="pms-engine-testnet"` filtered alerts.
    # v0.52.1+ uses a Docker client that negotiates the version
    # correctly with the daemon.
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: pms-cadvisor-testnet
    privileged: true
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # cAdvisor needs read-only access to the host's cgroup tree, the
      # docker socket (to enumerate containers + their labels), and a
      # few root paths for filesystem metrics. Everything is `:ro`.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      # Loopback-only — operator can SSH-tunnel to inspect cAdvisor's UI
      # at http://127.0.0.1:8082, but no inbound from the public Internet.
      - "127.0.0.1:8082:8080"
    networks:
      # Internal so prometheus can scrape `cadvisor:8080`.
      - pms-testnet-internal
    command:
      # `docker_only` filters out Kubernetes / systemd-only containers.
      # We KEEP `store_container_labels` enabled (the default) because
      # it's what populates the `name` label on every metric — without
      # it the alert rules `container_memory_rss{name="..."}` filter
      # produces zero results.
      - '--docker_only=true'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PMS Simulator — Stress-test with ~97 agents
  # ---------------------------------------------------------------------------
  pms-simulator:
    image: pms-simulator:testnet
    container_name: pms-simulator-testnet
    # Production-realistic load (1000+ clicker agents across 4 game
    # ledgers, v0.7.8+) lifts steady-state RSS to ~1-1.5 GiB during
    # the bootstrap+mint storm and ~700 MiB after. The previous 512m
    # OOM-killed within seconds at the 100-agent boot phase. 2g leaves
    # comfortable headroom for the per-agent cube_id Vecs (360 strings
    # × 1000 agents × 64 chars ≈ 23 MiB raw, plus tokio task stacks
    # at ~2 MiB × 1000 ≈ 2 GiB worst case if every agent is in flight).
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      pms-gateway:
        condition: service_healthy
    environment:
      PMS_ADMIN_TOKEN: "${PMS_ADMIN_TOKEN}"
      PMS_API_KEY: "${PMS_API_KEY}"
      PMS_COORDINATOR_KEY: "${PMS_COORDINATOR_KEY}"
      PMS_COORDINATOR_ADDR: "${PMS_COORDINATOR_ADDR}"
      RUST_LOG: info,pms_simulator=info
    volumes:
      - ./tools/simulator/simulator.testnet.toml:/app/config/simulator.toml:ro
      - ./tools/simulator/agents_testnet.toml:/app/config/agents_testnet.toml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      - pms-testnet-public
    # on-failure: only restart on non-zero exit. The simulator exits with code 0
    # after exhausting 10 startup attempts (missing credentials), so Docker won't
    # restart it endlessly. Operational crashes (exit 1) still get restarted.
    restart: on-failure

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  pms-testnet-internal:
    driver: bridge
    internal: true
  pms-testnet-public:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  rocksdb_testnet_data:
  caddy_testnet_data:
  caddy_testnet_config:
  prometheus_testnet_data:
  alertmanager_testnet_data:
